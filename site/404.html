<!doctype html>
<html lang="bg" data-lang="bg" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Вярно — страницата не е намерена</title>
    <meta
      name="description"
      content="Тази страница не съществува. Калкулаторът на Вярно е на vyarno.bg."
    />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#E8ECEF" />
    <link
      rel="preload"
      href="/fonts/ibm-plex/IBMPlexSans-Regular-Cyrillic.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="app"></div>
    <noscript>
      <!--
        Client-side render, so with JavaScript off #app is empty. Same fallback
        as index.html: the app needs JavaScript, and the upstream attribution is
        a licence condition that must appear on every page including this one.
      -->
      <div
        style="
          max-width: 40rem;
          margin: 3rem auto;
          padding: 0 1.25rem;
          font-family: system-ui, sans-serif;
          line-height: 1.55;
        "
      >
        <p lang="bg">
          Тази страница не съществува. Вярно смята изцяло в браузъра ти и има нужда от JavaScript —
          включи го и отвори vyarno.bg.
        </p>
        <p lang="en">
          This page does not exist. Vyarno computes entirely in your browser and needs JavaScript —
          turn it on and open vyarno.bg.
        </p>
        <p>
          <small
            >Данни от Евростат / ЕЦБ / НСИ / БНБ / имот.bg · Data from Eurostat / ECB / NSI / BNB /
            imot.bg</small
          >
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/notfound-main.js"></script>
  </body>
</html>
