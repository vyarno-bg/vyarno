<!doctype html>
<html lang="bg" data-lang="bg" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Вярно — правна информация</title>
    <meta
      name="description"
      content="Условия за ползване, поверителност, идентификация на доставчика и източниците на данните на vyarno.bg."
    />
    <link rel="canonical" href="https://vyarno.bg/legal/" />
    <!--
      EU snippet opt-in. Google truncates snippets and image previews in the EU
      for publishers who have not asked otherwise, and that limit governs how
      much of a page can appear in a result AND in an AI Overview. Both
      directives are the maximum: this is a public good whose whole purpose is
      that the number reaches the person with its source attached, so a longer
      quotation of it is the outcome we want.

      Consistent with robots.txt rather than in tension with it — the note on
      the allowed agents already records that Googlebot and Bingbot are allowed
      and that AI Overviews are built on those same indexes. 404.html keeps its
      bare noindex and must never gain these.
    -->
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large" />

    <!--
    Indexable on purpose. ЗЕТ чл. 4 wants the provider's identifying
    information permanently and directly accessible, and "findable" is part of
    accessible — a page search engines are told to skip is one a person cannot
    find either. There is no og:image: a legal page shared as a link card is
    not a thing worth designing for, and the calculator's card should not be
    reused here.
  -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Вярно · vyarno.bg" />
    <meta property="og:locale" content="bg_BG" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta property="og:url" content="https://vyarno.bg/legal/" />
    <meta property="og:title" content="Вярно — правна информация" />
    <meta
      property="og:description"
      content="Условия за ползване, поверителност, идентификация на доставчика и източниците на данните."
    />

    <!--
    The identity page, in the form a machine parses. An agent citing this site
    reads the JSON-LD and never reaches the ЗЕТ чл. 4 table below it, so this
    is where "who is behind this" has to be answerable without rendering
    anything — which is the whole obligation the page exists to discharge.

    THE PROVIDER IS A PERSON and the node says nothing IDENTITY does not: an
    Organization would invent an organisational fact, and the `legal_name`
    row's own note states there is no company and no partners. The name is
    read back off IDENTITY by verify_legal.mjs so the two cannot drift.

    THE LICENCE SITS ON THE APPLICATION, NEVER ON THE PAGE. `license` on a
    schema.org node states the terms of THAT node's content, and this page
    quotes five publishers' own terms verbatim (docs/legal.md). Apache-2.0 on
    the WebPage would tell a citing agent that Eurostat's and НСИ's wording is
    ours to give away, on the one page whose subject is that it is not.

    `dateModified` is a SLOT filled by scripts/gen-jsonld.mjs from
    LEGAL_LASTMOD, which tracks the documents' effective date in
    src/lib/legal.js. A date that says the terms changed when they did not is
    worse than none, and a literal here is one nothing moves.
  -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebPage",
        "name": "Правна информация",
        "url": "https://vyarno.bg/legal/",
        "inLanguage": ["bg", "en"],
        "dateModified": "__LEGAL_LASTMOD__",
        "publisher": {
          "@type": "Person",
          "name": "Кирил Аламуров",
          "url": "https://vyarno.bg/legal/"
        },
        "isPartOf": {
          "@type": "WebApplication",
          "name": "Вярно",
          "url": "https://vyarno.bg/",
          "license": "https://www.apache.org/licenses/LICENSE-2.0"
        },
        "description": "Условия за ползване, поверителност, идентификация на доставчика и източниците на данните на vyarno.bg."
      }
    </script>

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#E8ECEF" />
    <link
      rel="preload"
      href="/fonts/ibm-plex/IBMPlexSans-Regular-Cyrillic.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="app"></div>
    <noscript>
      <!--
        `scripts/prerender.mjs` writes the four documents into #app at build
        time, so a reader with JavaScript off already has them — which is what
        ЗЕТ чл. 4 asks for, the identity being permanently and directly
        accessible rather than accessible to whoever runs the bundle. What they
        lose is the language toggle and the calculator behind the link, which is
        what these two sentences say. The upstream attribution is a licence
        condition that must appear on every page including this one, whether the
        bundle runs or the prerender step ever stops running.
      -->
      <div
        style="
          max-width: 40rem;
          margin: 3rem auto;
          padding: 0 1.25rem;
          font-family: system-ui, sans-serif;
          line-height: 1.55;
        "
      >
        <p lang="bg">
          Правната информация на тази страница се чете и без JavaScript — четирите документа са в
          самата страница. Без него не работят превключвателите за език и за тема, нито калкулаторът
          зад връзката. Питане по нещо оттук: contact@vyarno.bg.
        </p>
        <p lang="en">
          The legal information on this page reads without JavaScript — the four documents are in
          the page itself. Without it the language and theme toggles do not work, and neither does
          the calculator behind the link. A question about anything here: contact@vyarno.bg.
        </p>
        <p>
          <small
            >Данни от Евростат / ЕЦБ / НСИ / БНБ / имот.bg · Data from Eurostat / ECB / NSI / BNB /
            imot.bg</small
          >
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/legal-main.js"></script>
  </body>
</html>
