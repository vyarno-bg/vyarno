<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 22 22" width="22" height="22">
  <!-- Вярно.bg — a short bar, a tall bar, one unbroken rule joining their feet:
       "then" against "now", text-free so a brand change leaves the artwork
       alone. The rule is solid because the Facebook profile picture draws it
       solid, and that image is the copy of this mark we cannot re-render. The
       stroke's foot is level with the bars' — hung below them it reads as a
       block under the mark, not as the ground the two stand on. Same
       twenty-two units as `scripts/make_og_image.py`, which draws every bitmap
       surface that cannot read an SVG. -->
  <rect width="22" height="22" rx="3" fill="#ECEEE8"/>
  <rect x="3" y="7" width="4" height="12" rx="1" fill="#676E64"/>
  <rect x="15" y="3" width="4" height="16" rx="1" fill="#1C6B54"/>
  <path d="M7 18.3 H15" stroke="#1C6B54" stroke-width="1.4" fill="none"/>
</svg>
