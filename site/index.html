<!doctype html>
<html lang="bg" data-lang="bg" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Вярно — сметни своята инфлация</title>
    <!--
    The description names what the page actually computes, not just the
    inflation half. "Калкулатор за лична инфлация" was the description
    everywhere for a while and it describes roughly a third of what ships:
    somebody searching for «колко ми взима данъкът» or «стига ли ми за
    жилище» has no way to tell this page answers them. Kept under ~160
    characters so search results do not truncate mid-clause.
  -->
    <meta
      name="description"
      content="Личната ти инфлация, реалната ти заплата, данъкът, наемът и пътят до жилище — сметнато в браузъра ти от официални данни. Нищо не се изпраща."
    />
    <link rel="canonical" href="https://vyarno.bg/" />
    <!--
      EU snippet opt-in. Google truncates snippets and image previews in the EU
      for publishers who have not asked otherwise, and that limit governs how
      much of a page can appear in a result AND in an AI Overview. Both
      directives are the maximum: this is a public good whose whole purpose is
      that the number reaches the person with its source attached, so a longer
      quotation of it is the outcome we want.

      Consistent with robots.txt rather than in tension with it — the note on
      the allowed agents already records that Googlebot and Bingbot are allowed
      and that AI Overviews are built on those same indexes. 404.html keeps its
      bare noindex and must never gain these.
    -->
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large" />

    <!--
    Share previews. The results card hands a reader a picture and a sentence
    to send (share-card.js), so a link posted to Viber, Messenger or X — which
    is how things spread in Bulgaria — has to unfurl into something. Without
    og:image, og:url, canonical and twitter:card it unfurls into a blank box,
    and the share surfaces are live.

    og:image is a static 1200×630 PNG baked into /public. It carries the
    wordmark and the strapline only: NO number, deliberately. Preview images
    are cached hard by every platform, and a stale inflation figure in a cached
    card is our credibility, not theirs (docs/principles.md P4). The card the
    READER generates does carry their rate — it is drawn per share and cached
    by nobody, which is the difference.
  -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Вярно · vyarno.bg" />
    <meta property="og:locale" content="bg_BG" />
    <!--
    The page serves both languages off one URL, so bg_BG is what it declares
    and en_US is what it also answers in. An unfurler picking a locale it can
    read is the whole of what this buys; it is not an hreflang pair and must
    not be written up as one, because there is no second URL to point at.
  -->
    <meta property="og:locale:alternate" content="en_US" />
    <meta property="og:url" content="https://vyarno.bg/" />
    <meta property="og:title" content="Вярно — сметни своята инфлация" />
    <meta
      property="og:description"
      content="Инфлацията ти, реалната ти заплата и пътят до жилище — за 30 секунди, без регистрация, от официални данни, изцяло в твоя браузър."
    />
    <meta property="og:image" content="https://vyarno.bg/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Вярно · vyarno.bg — сметни своята инфлация, от официалните данни на Евростат"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Вярно — сметни своята инфлация" />
    <meta
      name="twitter:description"
      content="Инфлацията ти, реалната ти заплата и пътят до жилище — за 30 секунди, без регистрация, от официални данни, изцяло в твоя браузър."
    />
    <meta name="twitter:image" content="https://vyarno.bg/og-image.png" />

    <!--
    Structured data, and the two things it deliberately does not say.

    NOT a Dataset node. That would describe data/published/ as a dataset this
    project publishes and offers for reuse, and two of the five upstreams make
    that false — НСИ's licence forbids distributing производни и сборни
    произведения outright. `license` below is scoped to the CODE for the same
    reason the footer's licence line is: the figures are not ours to license
    and no shipped document may say otherwise (docs/legal.md §"Our own
    licence", and a test fails on copy that calls the data open).

    NOT an aggregateRating, a ratingCount or an interactionCount. Nothing here
    counts users or collects a rating, and a badge nothing measures is the one
    kind of decoration docs/principles.md rules out by name.

    A ld+json block is inert data rather than script, so `script-src 'self'`
    in public/_headers does not reach it and no nonce is needed. Check that
    with a real browser if this block ever grows, because the failure mode is
    a console error on every page load rather than a red test.

    `dateModified` is a SLOT, filled by scripts/gen-jsonld.mjs from the newest
    `as_of` across the published payloads — the same value the sitemap's
    <lastmod> carries. A literal here would be a second copy of a date that
    moves on every refresh, in the one field a crawler treats as this page's
    freshness. `npm run dev` serves the token unfilled; the step's header says
    why that is the cheap side of the trade.

    THE PROVIDER IS A PERSON, and the node may say nothing the ЗЕТ чл. 4 table
    does not. `IDENTITY`'s `legal_name` row publishes «Кирил Аламуров» as a
    natural person and its note says in as many words that there is no company,
    no partners and nobody has paid for anything — so an Organization here
    would be inventing an organisational fact, which AGENTS.md forbids by name.
    A name and a route to /legal/ is the whole node: every field added is one
    check-identity.mjs and that table have to stay true to.
    verify_legal.mjs §"the structured data names the provider the legal page
    names" reads the name back off IDENTITY so the two cannot drift.
  -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Вярно",
        "alternateName": "Vyarno",
        "url": "https://vyarno.bg/",
        "applicationCategory": "FinanceApplication",
        "operatingSystem": "Any browser",
        "browserRequirements": "Requires JavaScript",
        "inLanguage": ["bg", "en"],
        "isAccessibleForFree": true,
        "license": "https://www.apache.org/licenses/LICENSE-2.0",
        "codeRepository": "https://github.com/vyarno-bg/vyarno",
        "dateModified": "__DATA_LASTMOD__",
        "author": {
          "@type": "Person",
          "name": "Кирил Аламуров",
          "url": "https://vyarno.bg/legal/"
        },
        "publisher": {
          "@type": "Person",
          "name": "Кирил Аламуров",
          "url": "https://vyarno.bg/legal/"
        },
        "description": "Личната ти инфлация, реалната ти заплата, данъкът, наемът и пътят до жилище — сметнато в браузъра ти от официални данни."
      }
    </script>

    <!-- SVG only: 592 bytes, scales to every slot, no rasterised set to keep
       in sync. Same geometry as the in-app wordmark in App.svelte. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/og-image.png" />
    <meta name="theme-color" id="metaTheme" content="#E8ECEF" />
    <!--
    Self-hosted fonts. No third-party CSS / no Google Fonts: CSP
    "no third-party scripts" is a locked tenet (docs/principles.md §"Identity").
    Only the Cyrillic + Latin subsets are shipped — keeps total
    transfer under 250 kB.
  -->
    <link
      rel="preload"
      href="/fonts/ibm-plex/IBMPlexSans-Regular-Cyrillic.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/ibm-plex/IBMPlexSans-SemiBold-Cyrillic.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="app"></div>
    <noscript>
      <!--
        `scripts/prerender.mjs` writes the shell and the explainer's prose into
        #app at build time, so with JavaScript off a reader gets a page and no
        calculator on it — every figure needs the bundle. These three sentences
        are what tells them the numbers are computed in their own browser
        rather than withheld, and they carry the upstream attribution, which is
        a licence condition of several sources: it has to be here whether the
        bundle runs or the prerender step ever stops running.
      -->
      <div
        style="
          max-width: 40rem;
          margin: 3rem auto;
          padding: 0 1.25rem;
          font-family: system-ui, sans-serif;
          line-height: 1.55;
        "
      >
        <p lang="bg">
          Вярно смята изцяло в браузъра ти и затова има нужда от JavaScript. Включи го и презареди
          страницата — нищо от числата ти не се изпраща никъде.
        </p>
        <p lang="en">
          Vyarno computes entirely in your browser, so it needs JavaScript. Turn it on and reload —
          none of your figures are sent anywhere.
        </p>
        <p>
          <small
            >Данни от Евростат / ЕЦБ / НСИ / БНБ / имот.bg · Data from Eurostat / ECB / NSI / BNB /
            imot.bg</small
          >
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
