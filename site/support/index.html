<!doctype html>
<html lang="bg" data-lang="bg" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Вярно: кой плаща за проекта</title>
    <!--
      What the donations cover is a fact `src/lib/support.js` owns, and this
      tag has to say what that file says. A head tag is the one surface where
      the claim is read with no page beside it to correct it — a search result,
      an unfurl, an agent's summary — so a sentence here that the page
      contradicts is the version most people get. `support.js#line` names the
      domain and says the hosting is free; naming a server as something
      donations pay for describes a cost nobody has.
    -->
    <meta
      name="description"
      content="Вярно е безплатно за всички и няма платена версия. Домейнът се плаща от дарения; хостингът е безплатен. Дарението не купува нищо."
    />
    <link rel="canonical" href="https://vyarno.bg/support/" />
    <!--
      The same page in the other language, and itself. `hreflang` is reciprocal
      by definition — Google discards a set where a page names an alternate that
      does not name it back — so all eight entries carry all three lines and
      each one names ITSELF among them. `verify_static_assets.mjs` holds the
      whole collection to that rather than checking this file alone, because a
      one-sided set fails silently: both pages keep serving, and the pair is
      simply never treated as a pair.

      x-default is the Bulgarian page. It is what a search engine serves a
      reader whose language it cannot place, and this is a calculator of
      Bulgarian prices, Bulgarian payroll law and Sofia housing written for a
      person living in Bulgaria (docs/README.md §"Who this is for") — the same
      reasoning that makes BG the default in `stores.js` and keeps
      `navigator.language` out of it.
    -->
    <link rel="alternate" hreflang="bg" href="https://vyarno.bg/support/" />
    <link rel="alternate" hreflang="en" href="https://vyarno.bg/en/support/" />
    <link rel="alternate" hreflang="x-default" href="https://vyarno.bg/support/" />
    <!--
      EU snippet opt-in. Google truncates snippets and image previews in the EU
      for publishers who have not asked otherwise, and that limit governs how
      much of a page can appear in a result AND in an AI Overview. Both
      directives are the maximum: this is a public good whose whole purpose is
      that the number reaches the person with its source attached, so a longer
      quotation of it is the outcome we want.

      Consistent with robots.txt rather than in tension with it — the note on
      the allowed agents already records that Googlebot and Bingbot are allowed
      and that AI Overviews are built on those same indexes. 404.html keeps its
      bare noindex and must never gain these.
    -->
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large" />

    <!--
    Indexable, and this is the page where that matters most: it exists so the
    funding answer has an address a person can be given. There is no og:image —
    the calculator's card carries the strapline and a source line and should
    not be reused to advertise a donation page.
  -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Вярно · vyarno.bg" />
    <meta property="og:locale" content="bg_BG" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta property="og:url" content="https://vyarno.bg/support/" />
    <meta property="og:title" content="Вярно: кой плаща за проекта" />
    <!--
      This page has no card, so the description IS the unfurl — the whole of
      what a recipient is given before deciding whether to open it. So it names
      the product before it names the funding: somebody sent this link is
      usually being answered «кой стои зад това», and a line about what
      donations cover tells them nothing about what they are being sent to.
    -->
    <meta
      property="og:description"
      content="Вярно е безплатен калкулатор върху официална статистика. Няма платена версия и няма функции за дарители: дарението не купува нищо."
    />

    <!--
    A WebPage, so the page a person is given as the funding answer is one a
    machine can also place. Prerendered, indexable and in the sitemap like the
    other three; without a node it was the only one an agent had to infer from
    prose.

    NO dateModified. Its content changes when a channel opens or the copy is
    edited, and neither is a date anything in this build can read — the same
    reasoning gen-sitemap.mjs gives for leaving <lastmod> off this page. An
    omitted field costs a crawler nothing next to a false one.

    THE LICENCE SITS ON THE APPLICATION, NEVER ON THE PAGE — the rule
    verify_legal.mjs walks every node for. Nothing on this page is a published
    figure, which is exactly why it would be the easy place to relax it.
  -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebPage",
        "name": "Кой плаща за проекта",
        "url": "https://vyarno.bg/support/",
        "inLanguage": "bg",
        "isPartOf": {
          "@type": "WebApplication",
          "name": "Вярно",
          "url": "https://vyarno.bg/",
          "license": "https://www.apache.org/licenses/LICENSE-2.0"
        },
        "description": "Вярно е безплатно за всички и няма платена версия. Домейнът и сървърът се плащат от дарения, които не купуват нищо."
      }
    </script>

    <!-- The SVG serves the tab. The raster set serves everything that cannot
       read one: Chrome paints the default globe in its history, its
       restore-tabs card and its new-tab tiles for an SVG-only site, and iOS
       crops apple-touch-icon to a square. One geometry, generated from the
       same lockup as the OG card by scripts/make_og_image.py. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#E8ECEF" />
    <link
      rel="preload"
      href="/fonts/ibm-plex/IBMPlexSans-Regular-Cyrillic.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="app"></div>
    <noscript>
      <!--
        `scripts/prerender.mjs` writes the whole ask into #app at build time, so
        a reader with JavaScript off already has it. The one fact this page
        exists to carry is repeated here anyway rather than left to that step:
        it is the answer somebody arrives wanting, and it has to survive the
        prerender ever stopping. The upstream attribution is a licence condition
        that must appear on every page including this one.
      -->
      <div
        style="
          max-width: 40rem;
          margin: 3rem auto;
          padding: 0 1.25rem;
          font-family: system-ui, sans-serif;
          line-height: 1.55;
        "
      >
        <p lang="bg">
          Вярно е безплатно за всички и няма платена версия. Домейнът и сървърът се плащат от
          дарения. Страницата се чете и без JavaScript; без него не работи превключвателят за тема,
          нито калкулаторът зад връзката.
        </p>
        <p lang="en">
          Vyarno is free for everyone and has no paid version. The domain and the server are paid
          for by donations. This page reads without JavaScript; without it the theme toggle does not
          work, and neither does the calculator behind the link.
        </p>
        <p>
          <small
            >Данни от Евростат / ЕЦБ / НСИ / БНБ / имот.bg · Data from Eurostat / ECB / NSI / BNB /
            imot.bg</small
          >
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/support-main.js"></script>
  </body>
</html>
