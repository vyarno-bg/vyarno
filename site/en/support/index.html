<!doctype html>
<html lang="en" data-lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vyarno — who pays for the project</title>
    <meta
      name="description"
      content="Vyarno is free for everyone and has no paid version. The domain and the server are paid for by donations, which buy nothing."
    />
    <link rel="canonical" href="https://vyarno.bg/en/support/" />
    <!--
      The same page in the other language, and itself. `hreflang` is reciprocal
      by definition — Google discards a set where a page names an alternate that
      does not name it back — so all eight entries carry all three lines and
      each one names ITSELF among them. `verify_static_assets.mjs` holds the
      whole collection to that rather than checking this file alone.

      x-default is the Bulgarian page, on this page as on every other
      (docs/README.md §"Who this is for").
    -->
    <link rel="alternate" hreflang="bg" href="https://vyarno.bg/support/" />
    <link rel="alternate" hreflang="en" href="https://vyarno.bg/en/support/" />
    <link rel="alternate" hreflang="x-default" href="https://vyarno.bg/support/" />
    <!--
      EU snippet opt-in. Google truncates snippets and image previews in the EU
      for publishers who have not asked otherwise, and that limit governs how
      much of a page can appear in a result AND in an AI Overview. Both
      directives are the maximum: this is a public good whose whole purpose is
      that the number reaches the person with its source attached, so a longer
      quotation of it is the outcome we want.

      Consistent with robots.txt rather than in tension with it — the note on
      the allowed agents already records that Googlebot and Bingbot are allowed
      and that AI Overviews are built on those same indexes. 404.html keeps its
      bare noindex and must never gain these.
    -->
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large" />

    <!--
    Indexable, and this is the page where that matters most: it exists so the
    funding answer has an address a person can be given. There is no og:image —
    the calculator's card carries the strapline and a source line and should
    not be reused to advertise a donation page.
  -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Вярно · vyarno.bg" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="bg_BG" />
    <meta property="og:url" content="https://vyarno.bg/en/support/" />
    <meta property="og:title" content="Vyarno — who pays for the project" />
    <meta property="og:description" content="What donations cover, and what they do not buy." />

    <!--
    A WebPage, so the page a person is given as the funding answer is one a
    machine can also place.

    NO dateModified. Its content changes when a channel opens or the copy is
    edited, and neither is a date anything in this build can read — the same
    reasoning gen-sitemap.mjs gives for leaving <lastmod> off this page. An
    omitted field costs a crawler nothing next to a false one.

    THE LICENCE SITS ON THE APPLICATION, NEVER ON THE PAGE — the rule
    verify_legal.mjs walks every node for. Nothing on this page is a published
    figure, which is exactly why it would be the easy place to relax it.
  -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebPage",
        "name": "Who pays for the project",
        "url": "https://vyarno.bg/en/support/",
        "inLanguage": "en",
        "isPartOf": {
          "@type": "WebApplication",
          "name": "Вярно",
          "alternateName": "Vyarno",
          "url": "https://vyarno.bg/",
          "license": "https://www.apache.org/licenses/LICENSE-2.0"
        },
        "description": "Vyarno is free for everyone and has no paid version. The domain and the server are paid for by donations, which buy nothing."
      }
    </script>

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#E8ECEF" />
    <link
      rel="preload"
      href="/fonts/ibm-plex/IBMPlexSans-Regular-Cyrillic.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="app"></div>
    <noscript>
      <!--
        `scripts/prerender.mjs` writes the whole ask into #app at build time, so
        a reader with JavaScript off already has it. The one fact this page
        exists to carry is repeated here anyway rather than left to that step:
        it is the answer somebody arrives wanting, and it has to survive the
        prerender ever stopping. The upstream attribution is a licence condition
        that must appear on every page including this one.
      -->
      <div
        style="
          max-width: 40rem;
          margin: 3rem auto;
          padding: 0 1.25rem;
          font-family: system-ui, sans-serif;
          line-height: 1.55;
        "
      >
        <p lang="en">
          Vyarno is free for everyone and has no paid version. The domain and the server are paid
          for by donations. This page reads without JavaScript; without it the theme toggle does not
          work, and neither does the calculator behind the link.
        </p>
        <p lang="bg">
          Вярно е безплатно за всички и няма платена версия. Домейнът и сървърът се плащат от
          дарения. Страницата се чете и без JavaScript; без него не работи превключвателят за тема,
          нито калкулаторът зад връзката.
        </p>
        <p>
          <small
            >Данни от Евростат / ЕЦБ / НСИ / БНБ / имот.bg · Data from Eurostat / ECB / NSI / BNB /
            imot.bg</small
          >
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/support-main.js"></script>
  </body>
</html>
