<!doctype html>
<html lang="en" data-lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vyarno — legal information</title>
    <meta
      name="description"
      content="Terms of use, privacy, the provider's identity and the sources of the data on vyarno.bg."
    />
    <link rel="canonical" href="https://vyarno.bg/en/legal/" />
    <!--
      The same page in the other language, and itself. `hreflang` is reciprocal
      by definition — Google discards a set where a page names an alternate that
      does not name it back — so all eight entries carry all three lines and
      each one names ITSELF among them. `verify_static_assets.mjs` holds the
      whole collection to that rather than checking this file alone.

      x-default is the Bulgarian page, and on this entry that is more than a
      default: the four documents are written in Bulgarian first and the ЗЕТ
      чл. 4 identity table is a Bulgarian obligation. A reader a search engine
      cannot place is sent to the original.
    -->
    <link rel="alternate" hreflang="bg" href="https://vyarno.bg/legal/" />
    <link rel="alternate" hreflang="en" href="https://vyarno.bg/en/legal/" />
    <link rel="alternate" hreflang="x-default" href="https://vyarno.bg/legal/" />
    <!--
      EU snippet opt-in. Google truncates snippets and image previews in the EU
      for publishers who have not asked otherwise, and that limit governs how
      much of a page can appear in a result AND in an AI Overview. Both
      directives are the maximum: this is a public good whose whole purpose is
      that the number reaches the person with its source attached, so a longer
      quotation of it is the outcome we want.

      Consistent with robots.txt rather than in tension with it — the note on
      the allowed agents already records that Googlebot and Bingbot are allowed
      and that AI Overviews are built on those same indexes. 404.html keeps its
      bare noindex and must never gain these.
    -->
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large" />

    <!--
    Indexable on purpose. ЗЕТ чл. 4 wants the provider's identifying
    information permanently and directly accessible, and "findable" is part of
    accessible — a page search engines are told to skip is one a person cannot
    find either. There is no og:image: a legal page shared as a link card is
    not a thing worth designing for, and the calculator's card should not be
    reused here.
  -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Вярно · vyarno.bg" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="bg_BG" />
    <meta property="og:url" content="https://vyarno.bg/en/legal/" />
    <meta property="og:title" content="Vyarno — legal information" />
    <meta
      property="og:description"
      content="Terms of use, privacy, the provider's identity and the sources of the data."
    />

    <!--
    The identity page, in the form a machine parses. An agent citing this site
    reads the JSON-LD and never reaches the ЗЕТ чл. 4 table below it, so this
    is where "who is behind this" has to be answerable without rendering
    anything — which is the whole obligation the page exists to discharge.

    THE PROVIDER IS A PERSON and the node says nothing IDENTITY does not: an
    Organization would invent an organisational fact, and the `legal_name`
    row's own note states there is no company and no partners.

    THE LICENCE SITS ON THE APPLICATION, NEVER ON THE PAGE. This page quotes
    five publishers' own terms verbatim (docs/legal.md), and Apache-2.0 on the
    WebPage would tell a citing agent that Eurostat's and НСИ's wording is ours
    to give away, on the one page whose subject is that it is not.

    `dateModified` is a SLOT filled by scripts/gen-jsonld.mjs from
    LEGAL_LASTMOD, which tracks the documents' effective date in
    src/lib/legal.js — the same date the Bulgarian entry carries, because the
    documents are one set published in two languages rather than two sets.
  -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebPage",
        "name": "Legal information",
        "url": "https://vyarno.bg/en/legal/",
        "inLanguage": "en",
        "dateModified": "__LEGAL_LASTMOD__",
        "publisher": {
          "@type": "Person",
          "name": "Кирил Аламуров",
          "url": "https://vyarno.bg/legal/"
        },
        "isPartOf": {
          "@type": "WebApplication",
          "name": "Вярно",
          "alternateName": "Vyarno",
          "url": "https://vyarno.bg/",
          "license": "https://www.apache.org/licenses/LICENSE-2.0"
        },
        "description": "Terms of use, privacy, the provider's identity and the sources of the data on vyarno.bg."
      }
    </script>

    <!-- The SVG serves the tab. The raster set serves everything that cannot
       read one: Chrome paints the default globe in its history, its
       restore-tabs card and its new-tab tiles for an SVG-only site, and iOS
       crops apple-touch-icon to a square. One geometry, generated from the
       same lockup as the OG card by scripts/make_og_image.py. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#E8ECEF" />
    <link
      rel="preload"
      href="/fonts/ibm-plex/IBMPlexSans-Regular-Cyrillic.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="app"></div>
    <noscript>
      <!--
        `scripts/prerender.mjs` writes the four documents into #app at build
        time, so a reader with JavaScript off already has them — which is what
        ЗЕТ чл. 4 asks for, the identity being permanently and directly
        accessible rather than accessible to whoever runs the bundle. The
        upstream attribution is a licence condition that must appear on every
        page including this one.
      -->
      <div
        style="
          max-width: 40rem;
          margin: 3rem auto;
          padding: 0 1.25rem;
          font-family: system-ui, sans-serif;
          line-height: 1.55;
        "
      >
        <p lang="en">
          The legal information on this page reads without JavaScript — the four documents are in
          the page itself. Without it the theme toggle does not work, and neither does the
          calculator behind the link. A question about anything here: contact@vyarno.bg.
        </p>
        <p lang="bg">
          Правната информация на тази страница се чете и без JavaScript — четирите документа са в
          самата страница. Без него не работи превключвателят за тема, нито калкулаторът зад
          връзката. Питане по нещо оттук: contact@vyarno.bg.
        </p>
        <p>
          <small
            >Данни от Евростат / ЕЦБ / НСИ / БНБ / имот.bg · Data from Eurostat / ECB / NSI / BNB /
            imot.bg</small
          >
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/legal-main.js"></script>
  </body>
</html>
