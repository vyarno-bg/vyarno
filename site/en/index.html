<!doctype html>
<html lang="en" data-lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vyarno — work out your own inflation</title>
    <!--
    The English counterpart of the calculator, and a real URL rather than a
    rendering of the Bulgarian one. Both languages were served off `/` and only
    the Bulgarian half reached a crawler — `prerender.mjs` writes the language
    the entry declares and drops the other — so there was no document an English
    query could rank for and no second URL for an `hreflang` pair to point at
    (docs/seo.md).

    The description names what the page computes rather than the inflation half
    alone, for the reason the Bulgarian entry gives at length, and stays under
    ~160 characters so a result does not truncate mid-clause.
  -->
    <meta
      name="description"
      content="Your own inflation, your real wage, the tax, the rent and the road to a home — worked out in your browser from official data. Nothing is sent anywhere."
    />
    <link rel="canonical" href="https://vyarno.bg/en/" />
    <!--
      The same page in the other language, and itself. `hreflang` is reciprocal
      by definition — Google discards a set where a page names an alternate that
      does not name it back — so all eight entries carry all three lines and
      each one names ITSELF among them. `verify_static_assets.mjs` holds the
      whole collection to that rather than checking this file alone, because a
      one-sided set fails silently: both pages keep serving, and the pair is
      simply never treated as a pair.

      x-default is the Bulgarian page, on this page as on every other. It is
      what a search engine serves a reader whose language it cannot place, and
      this is a calculator of Bulgarian prices, Bulgarian payroll law and Sofia
      housing written for a person living in Bulgaria (docs/README.md §"Who this
      is for").
    -->
    <link rel="alternate" hreflang="bg" href="https://vyarno.bg/" />
    <link rel="alternate" hreflang="en" href="https://vyarno.bg/en/" />
    <link rel="alternate" hreflang="x-default" href="https://vyarno.bg/" />
    <!--
      EU snippet opt-in. Google truncates snippets and image previews in the EU
      for publishers who have not asked otherwise, and that limit governs how
      much of a page can appear in a result AND in an AI Overview. Both
      directives are the maximum: this is a public good whose whole purpose is
      that the number reaches the person with its source attached, so a longer
      quotation of it is the outcome we want.

      Consistent with robots.txt rather than in tension with it — the note on
      the allowed agents already records that Googlebot and Bingbot are allowed
      and that AI Overviews are built on those same indexes. 404.html keeps its
      bare noindex and must never gain these.
    -->
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large" />

    <!--
    Share previews. og:image is the same static 1200×630 PNG the Bulgarian
    entry points at, and it carries the wordmark and the strapline only: NO
    number, deliberately. Preview images are cached hard by every platform, and
    a stale inflation figure in a cached card is our credibility, not theirs
    (docs/principles.md P4). The card the READER generates does carry their
    rate — it is drawn per share and cached by nobody.
  -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Вярно · vyarno.bg" />
    <meta property="og:locale" content="en_US" />
    <!--
    The mirror of the Bulgarian entry's pair: en_US is this document's locale
    and bg_BG is the one its counterpart is in. Open Graph is what an unfurler
    reads and `hreflang` above is what a search engine reads, so the pair of
    URLs is stated in both vocabularies rather than in whichever came first.
  -->
    <meta property="og:locale:alternate" content="bg_BG" />
    <meta property="og:url" content="https://vyarno.bg/en/" />
    <meta property="og:title" content="Vyarno — work out your own inflation" />
    <meta
      property="og:description"
      content="Your inflation, your real wage and the road to a home — in 30 seconds, with no sign-up, from official data, entirely in your browser."
    />
    <meta property="og:image" content="https://vyarno.bg/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Вярно · vyarno.bg — work out your own inflation, from Eurostat's official data"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Vyarno — work out your own inflation" />
    <meta
      name="twitter:description"
      content="Your inflation, your real wage and the road to a home — in 30 seconds, with no sign-up, from official data, entirely in your browser."
    />
    <meta name="twitter:image" content="https://vyarno.bg/og-image.png" />

    <!--
    A WebPage, and the WebApplication it is part of is declared once — at
    https://vyarno.bg/, the Bulgarian root. There is one application and it
    answers at eight addresses, so a second WebApplication node here would be a
    second description of the same thing, free to drift from the first in the
    one place a citing agent reads instead of the page.

    THE LICENCE SITS ON THE APPLICATION, NEVER ON THE PAGE, which is the rule
    verify_legal.mjs walks every node for. `license` on a schema.org node states
    the terms of THAT node's content, and this page's content is Eurostat's, the
    ECB's, BNB's, NSI's and imot.bg's figures under five separate sets of terms
    (docs/legal.md).

    `dateModified` is a SLOT filled by scripts/gen-jsonld.mjs, and it takes the
    same value as the Bulgarian entry's: the two are prerendered from the same
    payloads in one build, so a refreshed payload changes what a visitor sees on
    either.
  -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebPage",
        "name": "Vyarno — work out your own inflation",
        "url": "https://vyarno.bg/en/",
        "inLanguage": "en",
        "dateModified": "__DATA_LASTMOD__",
        "isPartOf": {
          "@type": "WebApplication",
          "name": "Вярно",
          "alternateName": "Vyarno",
          "url": "https://vyarno.bg/",
          "license": "https://www.apache.org/licenses/LICENSE-2.0"
        },
        "description": "Your own inflation, your real wage, the tax, the rent and the road to a home — worked out in your browser from official data."
      }
    </script>

    <!-- The SVG serves the tab. The raster set serves everything that cannot
       read one: Chrome paints the default globe in its history, its
       restore-tabs card and its new-tab tiles for an SVG-only site, and iOS
       crops apple-touch-icon to a square. One geometry, generated from the
       same lockup as the OG card by scripts/make_og_image.py. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" id="metaTheme" content="#E8ECEF" />
    <!--
    The same two self-hosted subsets the Bulgarian entry preloads, and not a
    Latin-only pair: the wordmark «Вярно», the publisher names and the
    attribution line are Cyrillic on this page too, because they are a licence
    condition and are not translated (docs/legal.md).
  -->
    <link
      rel="preload"
      href="/fonts/ibm-plex/IBMPlexSans-Regular-Cyrillic.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/ibm-plex/IBMPlexSans-SemiBold-Cyrillic.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="app"></div>
    <noscript>
      <!--
        `scripts/prerender.mjs` writes the shell and the explainer's prose into
        #app at build time, so with JavaScript off a reader gets a page and no
        calculator on it — every figure needs the bundle. These sentences are
        what tells them the numbers are computed in their own browser rather
        than withheld, and they carry the upstream attribution, which is a
        licence condition of several sources: it has to be here whether the
        bundle runs or the prerender step ever stops running.
      -->
      <div
        style="
          max-width: 40rem;
          margin: 3rem auto;
          padding: 0 1.25rem;
          font-family: system-ui, sans-serif;
          line-height: 1.55;
        "
      >
        <p lang="en">
          Vyarno computes entirely in your browser, so it needs JavaScript. Turn it on and reload —
          none of your figures are sent anywhere.
        </p>
        <p lang="bg">
          Вярно смята изцяло в браузъра ти и затова има нужда от JavaScript. Включи го и презареди
          страницата — нищо от числата ти не се изпраща никъде.
        </p>
        <p>
          <small
            >Данни от Евростат / ЕЦБ / НСИ / БНБ / имот.bg · Data from Eurostat / ECB / NSI / BNB /
            imot.bg</small
          >
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
