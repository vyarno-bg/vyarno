# Quarterly property-market refresh (Eurostat prc_hpi_* — dwellings sold, what
# was paid for them, and the official house price index; plus the four
# structure cubes behind tenure, the census stock, price-to-income and
# housing-cost overburden).
#
# **One arm writes two payloads**, `house_market.json` and
# `house_market_structure.json`, and that is a constraint rather than a
# convenience: `refresh_report.owns` decides which files an arm owns by
# matching payload stems against the `--source` name with hyphens swapped for
# underscores. A structure payload named anything not starting `house_market`
# would be owned by no arm, so `refresh.yml` would find nothing of its own
# changed, skip the commit and the PR, and report the run GREEN while the
# payload never published.
#
# **The three price cubes do not release together.** Eurostat published the
# count and index cubes for 2026-Q1 on 02.07.2026 and the value cube — half of
# the average deal — on 09.07.2026, a week behind. The transform pairs count
# and value on the quarters they share, so a run between the two publishes the
# previous quarter again and opens no pull request; the run after the second
# cube lands publishes the new one. `watch.yml` probes each cube separately, so
# that costs one no-op run instead of a week of waiting.
#
# The six structure cubes move with the annual EU-SILC round in May–July
# instead, which is a window of its own in `release_calendar.py` and the reason
# the watch is per cube rather than per arm.
#
# The cron is the backstop for that watcher being broken: the 15th of the month
# after a quarter, clear of the slowest price cube observed and past the end of
# the EU-SILC round in the one quarter where the two windows meet.

name: refresh-house-market

on:
  schedule:
    - cron: "40 12 15 1,4,7,10 *"
  workflow_dispatch:
    inputs:
      detected:
        description: "The upstream publication a watcher saw. Reaches the PR body."
        required: false
        default: ""
        type: string

jobs:
  refresh:
    permissions:
      contents: write
      pull-requests: write
      actions: write
    uses: ./.github/workflows/refresh.yml
    with:
      source: house-market
      detected: ${{ inputs.detected || '' }}
