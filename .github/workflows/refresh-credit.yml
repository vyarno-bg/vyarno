# Monthly credit refresh (ECB MFI interest rates, households, non-housing).
#
# The same release as the mortgage arm for the rates — one ECB MFI publication
# carries every MIR BS_ITEM this reads — so the same window applies: month M
# lands between the last day of M+1 and the 5th of M+2, and the 6th catches
# every observed one.
#
# The arm also reads ECB BSI for the deposit and loan LEVELS, and that is a
# separate release on its own calendar. It has run ahead of MIR rather than
# behind it, so the 6th catches both; the arm gates BSI's own reference period
# against the same 150-day window so a release that slipped would fail loudly
# instead of publishing a level a month older than the rate beside it.
#
# An hour after `refresh-mortgage`, not beside it. The two arms open PRs against
# the same repository and the credit arm's card-above-mortgage gate compares a
# figure this release also moves; running them in sequence keeps the two
# branches from being cut from different halves of one publication.

name: refresh-credit

on:
  schedule:
    - cron: "0 5 6 * *"
  workflow_dispatch:

jobs:
  refresh:
    permissions:
      contents: write
      pull-requests: write
      actions: write
    uses: ./.github/workflows/refresh.yml
    with:
      source: credit
