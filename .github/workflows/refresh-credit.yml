# Monthly credit refresh (ЕЦБ MIR + BSI + CBD2, and БНБ's two rate sheets).
#
# **Four upstream calendars feed one payload.** The MIR rates land between the
# last day of M+1 and the 5th of M+2; BSI, which carries the deposit and loan
# LEVELS underneath those prices, releases about four days ahead of them; CBD2's
# quarterly household NPL ratio lands in the first fortnight of a month on its
# own rhythm; БНБ re-upload their two sheets around the end of the month. Each
# has its own window in `release_calendar.py` and `watch.yml` dispatches this
# arm on whichever moves first.
#
# That the arm can run between two of those releases is handled where it
# belongs: it gates BSI's reference period against the same 150-day window as
# the rates, so a level a month older than the price beside it fails loudly
# rather than publishing.
#
# The cron is the backstop for the watcher being broken, on the 9th once every
# window has closed. Half an hour behind the mortgage arm's, because the two
# open pull requests against one repository and the credit arm's
# card-above-mortgage gate reads a figure the same ЕЦБ release moves.

name: refresh-credit

on:
  schedule:
    - cron: "30 12 9 * *"
  workflow_dispatch:
    inputs:
      detected:
        description: "The upstream publication a watcher saw. Reaches the PR body."
        required: false
        default: ""
        type: string

jobs:
  refresh:
    permissions:
      contents: write
      pull-requests: write
      actions: write
    uses: ./.github/workflows/refresh.yml
    with:
      source: credit
      detected: ${{ inputs.detected || '' }}
