# Monthly HICP refresh.
#
# Eurostat publishes the final HICP with full country and COICOP
# breakdowns around the middle of the month for the previous month, at
# 11:00 CET. The 18th gives one day of headroom over the historical
# release window. A missed run costs a month — the headline figure
# a month stale on a page whose entire promise is that it is not.
#
# This source writes both hicp_headline.json and hicp_categories.json —
# every inflation figure on the page, including the whole personal basket.

name: refresh-hicp

on:
  schedule:
    # Cron schedules here are UTC and do not observe DST, so the local hour
    # moves twice a year: 04:00 UTC is 06:00 EET in winter and 07:00 EEST in
    # summer. Both sit after Eurostat's 11:00 CET release window for the
    # previous day's publish, which is what the hour is chosen against —
    # nothing here depends on it being a particular local time.
    # Runs can start 5–30 minutes late under load; acceptable here.
    - cron: "0 4 18 * *"
  workflow_dispatch:

jobs:
  refresh:
    # Permissions the called workflow needs: contents:write to push the
    # data/<source> branch, pull-requests:write to open the PR. GHA
    # evaluates permissions at the caller site, not in the reusable
    # workflow — declaring them here is required.
    permissions:
      contents: write
      pull-requests: write
      actions: write
    uses: ./.github/workflows/refresh.yml
    with:
      source: hicp
