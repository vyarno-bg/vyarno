# Monthly HICP refresh — the headline rate, the index and the whole basket.
#
# This source writes both hicp_headline.json and hicp_categories.json: every
# inflation figure on the page, including the reader's personal basket.
#
# **Two releases a month reach one cube, and only one of them is news.** The
# flash estimate carries BG's all-items rate on the reference month's own last
# working day, ahead of the index and every CPnn — that is the figure the
# papers run, and `cli.py#_refresh_hicp` publishes it alone under `is_flash`.
# The full release fills in the rest around the middle of the following month.
# A schedule that catches only the second never publishes a flash headline at
# all: by the time it fires, the full release has replaced what it would have
# caught. `watch.yml` watches both spans and dispatches this arm within ten
# minutes of either.
#
# The crons below are the backstop for that watcher being broken. Each fires
# once its own window has closed, which is the last hour at which running
# unconditionally is still the right thing to do.

name: refresh-hicp

on:
  schedule:
    # The 4th backs up the flash window, the 21st the full release.
    - cron: "20 12 4 * *"
    - cron: "20 12 21 * *"
  workflow_dispatch:
    inputs:
      detected:
        description: "The upstream publication a watcher saw. Reaches the PR body."
        required: false
        default: ""
        type: string

jobs:
  refresh:
    # Permissions the called workflow needs: contents:write to push the
    # data/<source> branch, pull-requests:write to open the PR. GHA
    # evaluates permissions at the caller site, not in the reusable
    # workflow — declaring them here is required.
    permissions:
      contents: write
      pull-requests: write
      actions: write
    uses: ./.github/workflows/refresh.yml
    with:
      source: hicp
      detected: ${{ inputs.detected || '' }}
