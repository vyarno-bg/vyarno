# Weekly freshness check — and who is holding the data up.
#
# Alerts when any payload in data/published/ is older than ITS OWN cadence, AND
# when a `data/<source>` pull request has been sitting open without being
# merged.
#
# **The cadence is per payload and comes from the manifest**, because one
# threshold cannot serve a monthly HICP release, a quarterly Eurostat cube and
# a four-yearly SES vintage at once. Held to a flat thirty days a healthy
# quarterly payload reports stale for sixty-one days of every ninety-one and
# `salary_dist` for all but a month of four years — a weekly alert that is
# wrong two weeks in three is one nobody opens, and this alert is the only
# thing watching for a refresh arm that has quietly stopped firing.
# `site/scripts/payload-cadence.mjs` prints the table and carries the argument.
#
# **The second half is the one that makes the first actionable.** Every source
# with a `refresh-<source>.yml` refreshes on a cron and opens a pull request.
# `city-price` has no such file and cannot have one — имот.bg answers a
# datacenter IP with a 403, so it is refreshed by hand instead
# (`release_calendar.NOT_WATCHED`), and this check is the only thing watching
# whether that has happened. Either way a payload reaches a reader only through
# a merge — and nothing merges them. Left alone the site ages while every gate
# stays green: the refresh ran, the gates passed, the PR opened, CI went green
# on it, and the figure a reader sees is the one from before. The only other
# signal is the overdue line on a page that reader may never open. So this
# check reports the two halves together, and a stale payload is reported beside
# the pull request that would fix it.
#
# **Nothing here merges anything, and `permissions` says so.** Auto-merge on
# green was the alternative and it is refused: a data refresh is the change
# where the diff IS the review — a number moving is the whole event — and a bot
# merging it removes the only human look any published figure gets. The gates
# cannot stand in for that; they catch a payload that is wrong in a way somebody
# already thought of. `docs/architecture.md` §CI carries the argument.
#
# The per-source refresh workflow reads the same table for the "other payloads
# that have gone quiet" list in its pull-request body, and
# `test_cli_dispatch.py` holds the two to that table rather than to each other —
# a number they agree on is still a number that can drift from the manifest both
# of them are describing. This fires at a payload's cadence and the page raises
# its banner at 1.5× the same figure (view/freshness.js#payloadStatus), so the
# alert reaches a maintainer with a fortnight in hand on the shortest cadence in
# the table and longer on every other.
#
# Failure handling: a non-zero exit surfaces in the GitHub Actions UI
# and (when configured in repo Notifications) emails the maintainer.
# No external alert integration.

name: freshness-check

on:
  schedule:
    # Monday 09:00 UTC. cron schedules are UTC, no DST. A weekly check
    # rather than daily — daily would alert on the same stale data
    # for a fortnight. Monday morning so the alert is actionable the
    # same day.
    - cron: "0 9 * * 1"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # Reading the open pull requests is the second half of the check. READ,
      # and it stays read: this workflow reports who has not merged the data and
      # never becomes the thing that merges it.
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compute payload ages
        id: payloads
        # **This step reports and does not exit.** It used to exit non-zero on
        # the first stale payload, which meant the pull-request half below never
        # ran on exactly the weeks it mattered — a payload is stale BECAUSE its
        # refresh is sitting in an unmerged PR, so the run that found the
        # staleness was the run that hid the reason for it. Both halves run and
        # the last step decides the exit code.
        #
        # The import list is the whole check. A name this script uses and does
        # not import raises before the first payload is read, and the failure
        # that carries — a non-zero exit from the step itself — is the same
        # signal a stale payload raises. So the alert fires every week, says
        # nothing true, and the week it means something is the week it has
        # already been learned to ignore.
        run: |
          set -euo pipefail
          node site/scripts/payload-cadence.mjs > /tmp/cadence.json
          python3 - <<'PY'
          import datetime, glob, json, os
          cadence = json.load(open("/tmp/cadence.json"))
          today = datetime.date.today()

          old = []
          for path in sorted(glob.glob("data/published/*.json")):
              stem = os.path.basename(path).removesuffix(".json")
              as_of = json.load(open(path)).get("as_of")
              if not as_of:
                  old.append(f"{stem} (no as_of)")
                  continue
              # **A published file with no row in the manifest is reported, not
              # skipped.** The site fetches what the manifest names, so a file
              # absent from it renders nowhere — and a lookup with a generous
              # default would let this check pass it silently for as long as it
              # sits in the directory.
              threshold_days = cadence.get(stem)
              if threshold_days is None:
                  old.append(f"{stem} (published, not in the payload manifest)")
                  continue
              days = (today - datetime.date.fromisoformat(as_of)).days
              if days > threshold_days:
                  old.append(f"{stem} ({days}d, cadence {threshold_days}d)")

          print(f"stale_count={len(old)}")
          print(f"stale={old}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"stale_count={len(old)}\n")
              f.write("stale<<EOF\n" + ", ".join(old) + "\nEOF\n")
          PY

      - name: List the data pull requests nobody merged
        id: prs
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        # A refresh arm pushes `data/<source>` and opens a pull request against
        # `main`; that PR is the only route a new figure has to a reader. One
        # open past a full cycle of this check has missed its review, and the
        # payload behind it is on its way to being reported stale by the step
        # above with no indication that the fix is already written.
        #
        # Seven days, because this check is weekly: a PR that was open the last
        # time this ran and is open now has been passed over once rather than
        # merely not looked at yet.
        with:
          script: |
            const OPEN_DAYS = 7;
            const now = Date.now();
            const { data: open } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              base: 'main',
              per_page: 100,
            });
            const waiting = open
              .filter((pr) => pr.head.ref.startsWith('data/'))
              .map((pr) => ({
                ref: pr.head.ref,
                number: pr.number,
                url: pr.html_url,
                days: Math.floor((now - Date.parse(pr.created_at)) / 86400000),
              }))
              .sort((a, b) => b.days - a.days);

            for (const pr of waiting) {
              core.info(`${pr.ref} — #${pr.number}, open ${pr.days}d — ${pr.url}`);
            }
            const late = waiting.filter((pr) => pr.days > OPEN_DAYS);
            core.setOutput('open_count', String(waiting.length));
            core.setOutput('late_count', String(late.length));
            core.setOutput(
              'late',
              late.map((pr) => `${pr.ref} (#${pr.number}, ${pr.days}d) ${pr.url}`).join('\n  ')
            );

      - name: Report
        # One exit code for both halves, so a week with a stale payload AND the
        # pull request that would fix it reports the pair rather than whichever
        # step ran first.
        env:
          STALE_COUNT: ${{ steps.payloads.outputs.stale_count }}
          STALE: ${{ steps.payloads.outputs.stale }}
          OPEN_COUNT: ${{ steps.prs.outputs.open_count }}
          LATE_COUNT: ${{ steps.prs.outputs.late_count }}
          LATE: ${{ steps.prs.outputs.late }}
        run: |
          set -euo pipefail
          echo "payloads past their own cadence: ${STALE_COUNT}"
          echo "open data PRs: ${OPEN_COUNT}, of them past a review cycle: ${LATE_COUNT}"
          FAIL=0
          if [[ "${STALE_COUNT}" != "0" ]]; then
            echo "::error::${STALE_COUNT} payload(s) past their own cadence: ${STALE}"
            FAIL=1
          fi
          if [[ "${LATE_COUNT}" != "0" ]]; then
            echo "::error::${LATE_COUNT} data pull request(s) open past a review cycle:"
            echo "  ${LATE}"
            echo "Nothing merges these. A payload reaches a reader through a merge and no other way."
            FAIL=1
          fi
          exit "$FAIL"
