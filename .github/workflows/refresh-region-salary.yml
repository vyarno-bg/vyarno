# Quarterly region-level salary refresh (НСИ "Наети лица и средна работна
# заплата" — all 28 regions, not just Sofia).
#
# **НСИ's day inside the month moves.** The 2026-Q2 workbooks went up on
# 2026-08-11 at 10:54 Sofia; the 15th has been the release day historically.
# So the window `release_calendar.py` records spans the 5th to the 20th and
# `watch.yml` dispatches this arm off the file's own Last-Modified header, the
# hour it changes.
#
# Both editions are read and they are uploaded about 45 minutes apart, so both
# are watched: whichever moves first starts the run, and the connector
# reconciles the pair as it always does.
#
# The cron is the backstop for that watcher being broken, on the 21st.

name: refresh-region-salary

on:
  schedule:
    - cron: "40 12 21 2,5,8,11 *"
  workflow_dispatch:
    inputs:
      detected:
        description: "The upstream publication a watcher saw. Reaches the PR body."
        required: false
        default: ""
        type: string

jobs:
  refresh:
    permissions:
      contents: write
      pull-requests: write
      actions: write
    uses: ./.github/workflows/refresh.yml
    with:
      source: region-salary
      detected: ${{ inputs.detected || '' }}
