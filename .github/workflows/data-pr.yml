# Opens the pull request for a data branch a PERSON pushed, and arms it.
#
# `make refresh-local` (pipeline/src/vyarno_pipeline/local_refresh.py) pushes
# `data/<source>-<date>` from a laptop and stops there: opening the pull
# request from the laptop would need a GitHub token on it, and this needs none
# beyond the job's own. The commit already carries the review, the was → now
# table and the soft flags, so the pull request body is the commit body plus
# the one line saying whether it merges itself.
#
# **The checks come from the push, not from this pull request.** A pull
# request opened by this job's token raises a `pull_request` run that waits for
# approval and runs zero jobs (run 42256855147 is one). The person's own push
# raised a full `ci.yml` run on the same SHA before this started, and those are
# the required contexts the pull request shows. So nothing is dispatched.
#
# `needs-review` goes on when the head commit's `Refresh-Flags:` trailer is
# above zero, or absent: a data branch nothing vouches for is one a person
# reads. It goes on BEFORE `automerge.py` runs, because a label this token adds
# raises no event, so `data-pr-hold.yml` never sees it. The refresh bot opens
# its own pull requests, and its token's pushes raise no run here anyway.
# docs/architecture.md §"What happens to a data pull request" is the rest.

name: data-pr

on:
  push:
    branches:
      - "data/**"

permissions: {}

concurrency:
  group: data-pr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  open:
    name: open the pull request for a pushed data branch
    if: github.event.deleted == false && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # the pushed commit's message, through the API; no checkout
      pull-requests: write # open the pull request, and create and apply the label
    outputs:
      number: ${{ steps.pr.outputs.number }}
      base: ${{ steps.pr.outputs.base }}
    steps:
      - name: Open it from the commit body, and label a flagged refresh
        id: pr
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const branch = process.env.BRANCH;
            const { data: commit } = await github.rest.git.getCommit({
              owner,
              repo,
              commit_sha: process.env.SHA,
            });
            const [subject, ...rest] = commit.message.split('\n');
            const trailer = commit.message.match(/^Refresh-Flags:\s*(\d+)\s*$/m);
            const flagged = trailer === null || Number(trailer[1]) > 0;
            const section = '`docs/architecture.md` §"What happens to a data pull request"';
            const fate = flagged
              ? `It is labelled \`needs-review\` and waits for a person. Remove the label once the flags are read and it merges itself when the five required CI checks are green; ${section}.`
              : `It merges itself once the five required CI checks are green. Label it \`hold\` to stop that; ${section}.`;
            const body = `${rest.join('\n').replace(/^\n+/, '')}\n---\n\n${fate}\n`;

            const open = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              head: `${owner}:${branch}`,
            });
            let pr;
            if (open.data.length > 0) {
              pr = open.data[0];
              core.info(`#${pr.number} is already open for ${branch}; not opening another.`);
            } else {
              ({ data: pr } = await github.rest.pulls.create({
                owner,
                repo,
                head: branch,
                base: 'main',
                title: subject,
                body,
              }));
              core.info(`Opened #${pr.number}: ${pr.html_url}`);
            }
            core.setOutput('number', String(pr.number));
            core.setOutput('base', pr.base.sha);

            if (flagged) {
              try {
                await github.rest.issues.getLabel({ owner, repo, name: 'needs-review' });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({
                  owner,
                  repo,
                  name: 'needs-review',
                  color: 'd93f0b',
                  description: 'A data refresh a person has to read before it merges',
                });
              }
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: pr.number,
                labels: ['needs-review'],
              });
              core.info(
                trailer === null
                  ? 'No Refresh-Flags trailer on the head commit: labelled needs-review.'
                  : `Refresh-Flags: ${trailer[1]}: labelled needs-review.`,
              );
            }

  merge:
    name: merge once CI is green, unless held
    needs: open
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # arming auto-merge is a merge permission, filed under contents too
      pull-requests: write # read the labels and the merge state, arm or disarm
    steps:
      - name: Checkout the base, never the pushed branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.open.outputs.base }}
          sparse-checkout: pipeline/src
          persist-credentials: false

      - name: Arm auto-merge, or hold it
        # `automerge.py` holds a `needs-review` or `hold` PR and arms only while
        # branch protection blocks it; stdlib on the runner's Python. Not fatal:
        # a PR it refuses waits for a merge by hand.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.open.outputs.number }}
        run: PYTHONPATH=pipeline/src python3 -m vyarno_pipeline.automerge --pr "$PR_NUMBER"
