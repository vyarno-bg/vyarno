# Salary distribution refresh (Eurostat SES).
#
# **This arm has one upstream and no dependency on any НСИ arm.** What it
# publishes is a SHAPE — the P1…P99 gross-earnings ladder as Eurostat's SES
# measures it, at Eurostat's own level. The re-levelling onto НСИ's national
# all-activities average happens in the reader's browser, against whatever
# `sector_salary.json` is live at the time (`cli.py#_refresh_salary_dist`,
# `docs/data-sources.md` §"Salary distribution").
#
# So there is no ordering to respect here and no run to wait for: publishing
# this while an НСИ payload is mid-refresh cannot produce a ladder at the wrong
# level, because this file carries no level.
#
# **SES is disseminated every four years**, and it has only ever moved in
# Eurostat's 23:00 batch — so `release_calendar.py` gives it one band a night
# through the spring months rather than a ten-minute watch, and `watch.yml`
# spends one request a day on it. The next wave is 2026's, transmitted April
# 2028 (`docs/data-sources.md` §"Update watch-list").
#
# The cron is the backstop for that watcher being broken. Annual, because the
# series is: a quarterly backstop on a four-yearly cube buys nothing but
# sixteen cached reads between vintages.

name: refresh-salary-dist

on:
  schedule:
    - cron: "50 12 1 6 *"
  workflow_dispatch:
    inputs:
      detected:
        description: "The upstream publication a watcher saw. Reaches the PR body."
        required: false
        default: ""
        type: string

jobs:
  refresh:
    permissions:
      contents: write
      pull-requests: write
      actions: write
    uses: ./.github/workflows/refresh.yml
    with:
      source: salary-dist
      detected: ${{ inputs.detected || '' }}
