# Quarterly salary distribution refresh (Eurostat SES).
#
# **This arm has one upstream and no dependency on any НСИ arm.** What it
# publishes is a SHAPE — the P1…P99 gross-earnings ladder as Eurostat's SES
# measures it, at Eurostat's own level. The re-levelling onto НСИ's national
# all-activities average happens in the reader's browser, against whatever
# `sector_salary.json` is live at the time (`cli.py#_refresh_salary_dist`,
# `docs/data-sources.md` §"Salary distribution").
#
# So there is no ordering to respect here and no run to wait for: publishing
# this while an НСИ payload is mid-refresh cannot produce a ladder at the wrong
# level, because this file carries no level. Chaining it behind another
# workflow would buy nothing and would make a quarterly publish depend on
# another workflow's conclusion — one failure upstream and this one silently
# never fires at all.

name: refresh-salary-dist

on:
  schedule:
    # Quarterly, 17th, 05:00 UTC — the same quarterly cluster as the two НСИ
    # arms, which is a convenience for reviewing them together rather than a
    # dependency. SES itself republishes about once a year; the quarterly
    # cadence costs one cached-read no-op per quarter, and the workflow skips
    # the commit and the PR when it detects one.
    - cron: "0 5 17 2,5,8,11 *"
  workflow_dispatch:

jobs:
  refresh:
    permissions:
      contents: write
      pull-requests: write
      actions: write
    uses: ./.github/workflows/refresh.yml
    with:
      source: salary-dist
