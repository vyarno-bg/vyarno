# Monthly mortgage refresh (ЕЦБ MIR + БНБ housing stock rate).
#
# Two publishers on two calendars. ЕЦБ MIR for month M lands between the last
# day of M+1 and the 5th of M+2, stamped 10:00 Frankfurt to the second; БНБ
# re-upload their rate workbook in the same span, around 11:40 Sofia.
# `watch.yml` reads a header from each inside its own window and dispatches
# this arm as soon as either moves, so a run does not wait on the slower of the
# two — the gates decide whether the pair is publishable, not the schedule.
#
# The cron is the backstop for that watcher being broken. It fires on the 9th,
# once both windows have closed.

name: refresh-mortgage

on:
  schedule:
    - cron: "20 12 9 * *"
  workflow_dispatch:
    inputs:
      detected:
        description: "The upstream publication a watcher saw. Reaches the PR body."
        required: false
        default: ""
        type: string

jobs:
  refresh:
    permissions:
      contents: write
      pull-requests: write
      actions: write
    uses: ./.github/workflows/refresh.yml
    with:
      source: mortgage
      detected: ${{ inputs.detected || '' }}
