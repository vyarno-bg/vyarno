# Quarterly sector-level salary refresh (НСИ "Наети лица и средна работна
# заплата" by economic activity — 19 NACE Rev 2 sections plus the total).
#
# The same НСИ quarterly release as the regional table, watched the same way:
# both editions' Last-Modified headers, inside the 5th-to-20th window
# `release_calendar.py` records, because the day inside the month moves — the
# 11th for 2026-Q2 against the 15th historically.
#
# **`sector_salary.json` is not one card's payload.** Its «Общо» all-activities
# row is the national level the percentile ladder is re-set to in the reader's
# browser, so this file going stale moves every rung of the salary ladder as
# well as the sector card — the payload with the widest reach is the one it is
# cheapest to leave behind without anybody noticing.
#
# The cron is the backstop for the watcher being broken, on the 21st. Ten
# minutes behind the regional arm's so two НСИ fetches do not open on the same
# minute; nothing depends on the order.

name: refresh-sector-salary

on:
  schedule:
    - cron: "50 12 21 2,5,8,11 *"
  workflow_dispatch:
    inputs:
      detected:
        description: "The upstream publication a watcher saw. Reaches the PR body."
        required: false
        default: ""
        type: string

jobs:
  refresh:
    permissions:
      contents: write
      pull-requests: write
      actions: write
    uses: ./.github/workflows/refresh.yml
    with:
      source: sector-salary
      detected: ${{ inputs.detected || '' }}
