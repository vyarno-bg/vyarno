# Continuous integration: both test suites and the production build.
#
# It does NOT refresh the data. Two of the five upstreams need network paths a
# cloud runner does not have, and a scheduled job that silently publishes a
# partial panel is worse than a manual one that fails loudly. The `live` probes
# are excluded for the same reason — run them from an ordinary network with
# `pytest -m live`.

name: CI

# `main` is the only long-lived branch; work happens on short-lived branches
# that merge into it (docs/local-development.md §"Branches, CI and pushing").
# The unfiltered `push` gates every branch before the merge and re-checks
# `main` after it.
#
# `pull_request` is here for the two things `push` structurally cannot do, and
# both are worth more than the duplicate run costs.
#
# **A fork's commits never touch this repository's refs.** No push event fires
# here, so no check run is ever created against that SHA — and with branch
# protection requiring these jobs by name, a pull request from a stranger was
# not merely unchecked, it was unmergeable, because the checks it waits on had
# no event that would produce them. Nothing in the repository said so: this
# file claimed the head commit "has already been pushed and checked", which is
# true of a branch pushed here and false of every fork.
#
# **`pull_request` builds `refs/pull/N/merge`, not the head.** That is a
# different tree from anything a push ever sees: a branch can be green, `main`
# can be green, and the merge of the two can be broken — a rename on one side
# against a new caller on the other, two payloads added to `payloads.js` in
# separate branches. The push run cannot see that commit because it does not
# exist until the pull request does.
#
# So a same-repo pull request now runs twice, and the second run is not a copy
# of the first. Scoping it with a job-level `if` to skip same-repo pull
# requests was the obvious way to avoid the duplicate and is a trap: a skipped
# job still CREATES its check run, GitHub resolves a required check to the
# latest run bearing that name, and the pull-request event fires after the
# push — so the skipped checks would land last and quietly become the gate.
# Paying for a second run is the cheaper of the two.
#
# **`pull_request`, never `pull_request_target`.** This trigger runs the base
# repository's copy of this file against the merge ref with a read-only token
# and no secrets. `pull_request_target` would run it with a writable token and
# the repository's secrets in reach of a fork's code, and it is the reason
# this workflow holds no credential in the first place
# (docs/architecture.md §CI).
#
# The concurrency group is `github.ref`, which is `refs/heads/<branch>` for a
# push and `refs/pull/N/merge` for a pull request, so the two runs are in
# separate groups and neither cancels the other.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseding a run is right on a working branch and wrong on `main`.
  #
  # On a branch, a second push means the first commit is no longer what anyone
  # will merge, so finishing its run answers a question nobody asked and holds
  # a runner while doing it.
  #
  # `main` is the deployed branch, and every commit on it is one somebody may
  # deploy — including the one a second merge arrives on top of. Cancelling
  # there leaves a commit on `main` whose CI never completed, and the record of
  # that is a grey circle beside a SHA that is already live. The gap is not
  # covered by the later run either: that run checks the tree AFTER both
  # merges, so if the first merge broke something the second one happens to
  # mask, nothing ever reported on the broken state.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Every job below carries a `timeout-minutes`, and the reasoning is the same
  # for all five so it is written once here.
  #
  # GitHub's default is 360 minutes. The failure that default is wrong for is
  # not a slow job, it is a HUNG one — a browser that never reaches its first
  # paint, a pip resolution sitting on an unresponsive mirror, a prompt waiting
  # on a tty that will never arrive. None of those fails; they wait. Six hours
  # later the run reports a timeout that names no step, and the branch has been
  # unmergeable all day for a reason nobody can read off the log.
  #
  # Each limit is several times that job's measured wall clock, so a slow
  # runner or a cold cache still passes and only a hang trips it. Raise one
  # when the work it covers genuinely grows; the number is headroom, not a
  # performance budget, and shaving it to fit today's timing turns an
  # infrastructure hiccup into a red branch.
  #
  # Every checkout below carries `persist-credentials: false`, and that
  # reasoning is shared too. None of the five jobs pushes, so the token has no
  # reason to outlive the clone. Left at its default the checkout writes it
  # into `.git/config`, where every later step can read it — and the later
  # steps run third-party code by the thousand: two dependency trees, a
  # browser, and whatever a pull request has added to either. With
  # `contents: read` and no secrets the blast radius is one public
  # repository's read access, so this is hygiene rather than a fix. It costs
  # nothing, and it stops being free to add on the day some job does need to
  # push, which is the day somebody would otherwise reach for the default.
  pipeline:
    name: pipeline · ruff + pytest
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          # The node side has been cached since it was written; this is the
          # same thing for pip, keyed on the lock rather than on a guess. What
          # is cached is the wheel cache, not the environment: `pip install`
          # still runs, still resolves, and still checks every hash, so the
          # `--require-hashes` guarantee the lock exists for is untouched.
          # Only the downloads are skipped, and the key changes the moment
          # `requirements-dev.txt` does.
          #
          # Measured, and it does not pay off HERE: restoring costs this job
          # about as long as the download it saves, so setup-python plus
          # install came out a few seconds worse than with no cache at all.
          # It stays because the same two lines take the `windows` job from
          # roughly thirty-six seconds to twenty-four, and that job is the
          # run's critical path while this one finishes long before it. So the
          # seconds lost here are not on anybody's clock and the seconds won
          # there are. Do not "fix" this by measuring only the ubuntu job.
          cache: pip
          cache-dependency-path: pipeline/requirements-dev.txt
      - name: Install
        working-directory: pipeline
        # From the lock, not from the ranges in pyproject.toml: `requirements-dev.txt`
        # pins every transitive dependency with a hash, so a CI run resolves to the
        # same tree a contributor got and a tampered artifact fails the install
        # rather than the tests. The package itself goes in `--no-deps` because an
        # editable install has nothing to hash.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e . --no-deps
      - name: Lint and format (ruff)
        # Config: ../ruff.toml. `format --check` is a check, never a fix — CI
        # reports the diff and the commit is what gets corrected.
        run: |
          ruff check .
          ruff format --check .
      - name: Offline suite (gates, transforms, connectors, published payloads)
        working-directory: pipeline
        # `live` probes are deselected by default — they hit real upstreams.
        # The junit-xml is not a second run: it is the count `check-test-floors`
        # reads in the next step, so the number comes from pytest rather than
        # from a figure somebody typed into a doc.
        run: pytest -q --junitxml=../.report-pytest.xml
      - name: No suite got smaller
        # This job and the site job are separate runners with separate disks, so
        # each checks the reports it produced and no step waits on the other.
        # Node is preinstalled on the runner image; this needs no setup-node.
        run: node site/scripts/check-test-floors.mjs pytest

  site:
    name: site · lint + types + math + contracts + build
    runs-on: ubuntu-latest
    # Longer than the others on this platform: it drives a browser, which is
    # the step here that can wait forever rather than fail.
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install
        working-directory: site
        run: npm ci
      - name: Lint and format (eslint, prettier)
        working-directory: site
        run: npm run lint
      - name: Types and component syntax (svelte-check)
        working-directory: site
        run: npm run check
      - name: Math, wiring, contracts and contrast
        working-directory: site
        run: npm run verify:math
      - name: Build
        working-directory: site
        run: npm run build
      - name: Cache the Chromium Playwright downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          # Keyed on the lock, because the lock is what pins the playwright
          # version and therefore which browser revision the next step asks
          # for. A key on the version string alone would need a step to read
          # it out; the lock is already on disk and changes at most monthly,
          # when Dependabot regenerates it.
          #
          # No `restore-keys`. A partial restore hands the run a browser at a
          # revision Playwright does not expect, which is the exact failure
          # `find-chromium.mjs` was written to prove against — and here it
          # would present as a launch error rather than as a cache miss. A
          # clean miss just downloads, which is what every run did before this
          # step existed.
          key: playwright-${{ runner.os }}-${{ hashFiles('site/package-lock.json') }}
      - name: Install Chromium for the render smoke test
        working-directory: site
        # Runs on a cache hit too, and has to. The cache carries the browser;
        # the apt packages it links against live in the runner image, which is
        # rebuilt for every job, so `--with-deps` is not the part that gets
        # skipped. On a hit this step is the system packages alone.
        run: npx playwright install --with-deps chromium
      - name: The built page actually renders
        working-directory: site
        # The only suite that runs the app. Everything above it tests a module
        # or reads a template as text, and neither can see a page that throws
        # on render — which is how a broken `{#each}` key once shipped past a
        # fully green build.
        run: npm run test:render
      - name: No suite got smaller
        working-directory: site
        # This job runs the suites directly rather than through
        # `check-all.mjs`, so the floor check has to be asked for here too —
        # otherwise the guard exists only for people running `make check`
        # locally, which is the half of the world that already reads the
        # output. A missing report fails: `test:render` exits 0 having
        # asserted nothing when it finds no browser, and that is exactly the
        # run this must not let through.
        run: node scripts/check-test-floors.mjs node render

  windows:
    name: windows · both toolchains install and both suites run
    runs-on: windows-latest
    # The longest job in the run, and the one with the most to hang on: it
    # installs both toolchains and drives a browser, on the slower runner.
    timeout-minutes: 20
    # Every other job is ubuntu-latest, which is the right default: it is what
    # the site is built and served on. The cost of it being the ONLY platform is
    # that nothing POSIX-shaped is ever contradicted, and six things had
    # quietly become Linux-only —
    #
    #   - `requirements*.txt` is generated by pip-compile, which resolves for
    #     the machine it runs on, so two dependencies that exist only on Windows
    #     never entered the lock: `colorama`, which click and pytest need, and
    #     `tzdata`, which `clock.py` needs because Windows ships no system tz
    #     database. With hashes present pip turns on --require-hashes and
    #     refuses the entire install over the first, and the second turns every
    #     import of `clock` into a ZoneInfoNotFoundError, so pytest cannot
    #     collect;
    #   - `build:release` set its environment variable with a POSIX shell
    #     prefix, which cmd.exe reads as the name of a program;
    #   - no `.gitattributes`, so a Windows clone checked out CRLF and every
    #     Prettier and ruff-format check failed on every file at once;
    #   - `check-identity.mjs` and `verify_support.mjs` passed a path to
    #     `await import()`, which takes a URL — `C:\…` raises
    #     ERR_UNSUPPORTED_ESM_URL_SCHEME, so the release guard and the donation
    #     guard both failed to start;
    #   - `strip-sourcemaps.mjs` collapsed `"/"` rather than `path.sep`, so the
    #     destination kept a backslash and `rename` had no directory to write to;
    #   - text-mode defaults: reads followed the locale encoding and choked on
    #     the UTF-8 Eurostat cubes, and `publish.write_payload` translated to
    #     `os.linesep` and rewrote all eight payloads CRLF.
    #
    # None of the six is exotic and all six shipped, because a claim that
    # nothing checks is a claim that decays. This job is the check. It runs the
    # commands directly rather than through `make`: GNU Make is not on a Windows
    # runner by default, and what has to keep working is the toolchain, not the
    # convenience wrapper over it.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          # Same cache as the `pipeline` job, and a separate one in practice:
          # the key carries the runner OS, so a Windows wheel never restores
          # onto ubuntu. That separation is what makes this safe here — the
          # whole reason this job exists is that a lock resolved on Linux is
          # missing the Windows-only dependencies, and a shared cache would
          # hand this job a Linux tree and hide exactly that.
          cache: pip
          cache-dependency-path: pipeline/requirements-dev.txt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install the pipeline from the hashed lock
        working-directory: pipeline
        # The step that fails when the lock is missing a Windows-only
        # dependency, and the reason this job exists at all.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e . --no-deps
      - name: Lint and format (ruff)
        # Reads CRLF as a formatting error, so this is also what fails if
        # `.gitattributes` stops normalising line endings on checkout.
        run: |
          ruff check .
          ruff format --check .
      - name: Offline suite (pytest)
        working-directory: pipeline
        run: pytest -q
      - name: Install the site toolchain
        working-directory: site
        run: npm ci
      - name: Lint and format (eslint, prettier)
        working-directory: site
        run: npm run lint
      - name: Math, wiring, contracts and contrast
        working-directory: site
        run: npm run verify:math
      - name: Release build
        working-directory: site
        # `build:release`, not `build` — the release path is the one that had
        # the shell-prefix problem, and it is the command that produces what
        # gets published. It fails rather than warns on an untrue identity,
        # which is the same standard `make check` holds a contributor to.
        run: npm run build:release
      - name: Cache the Chromium Playwright downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Where Playwright puts browsers on Windows. `~` is the runner's
          # profile directory, which is what `%USERPROFILE%` resolves to.
          path: ~/AppData/Local/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('site/package-lock.json') }}
      - name: Install Chromium for the render smoke test
        working-directory: site
        # No `--with-deps` here, unlike the ubuntu job: there are no system
        # packages to install, so a cache hit skips this step's whole reason
        # for taking any time at all.
        run: npx playwright install chromium
      - name: The built page actually renders
        working-directory: site
        run: npm run test:render
      # No floor check here, unlike the `site` job, and that is on purpose. How
      # many tests the repository has is a property of the repository, so
      # asking twice answers the same question twice — and the second answer is
      # not guaranteed to match: a suite that skipped a case on one platform
      # reports fewer passes there, which would fail this job for a reason that
      # has nothing to do with a deleted test. The `site` and `pipeline` jobs
      # own that check between them.

  authorship:
    name: authorship · every commit is signed by a person
    runs-on: ubuntu-latest
    # A full-history clone and one `git log` walk. The only thing here that
    # can take minutes is the fetch.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The check walks history back to a baseline, so a shallow clone
          # would report every commit as new on the first push of a branch.
          fetch-depth: 0
          persist-credentials: false
      - name: No commit is authored by a coding agent
        # A commit's author is the record of who is answerable for it, and
        # CONTRIBUTING.md §"Contributions written with a coding agent" puts that
        # on the person: "The agent wrote it" is not available as an explanation
        # for a number that turned out wrong. An agent identity in the author
        # field contradicts that in the one place a reader checks first.
        #
        # This bites hardest in a cloud agent session, where the container sets
        # its own git identity and rebuilds fresh every time, so a local fix
        # does not survive. The person running the session sets their own
        # identity; this is what notices when they have not.
        #
        # A DENYLIST rather than an allowlist of known contributors, and that is
        # the whole design. An allowlist makes a first-time contributor's PR
        # fail on a file they cannot edit, which is a barrier this project does
        # not want. Naming the agents costs a line each time a new one appears
        # and lets every human through on their first try.
        run: |
          set -euo pipefail
          # The rule applies from this commit forward, and the baseline may only
          # ever move forward. Moving it back turns commits other clones already
          # hold into failures that cannot be fixed without rewriting SHAs.
          BASELINE=73f00f3968f2dcda5d56700ff0b5c4e13d034944
          git cat-file -e "$BASELINE^{commit}" 2>/dev/null || {
            echo "::notice::baseline $BASELINE absent from history, nothing to check"
            exit 0
          }
          fail=0
          # NUL-delimited, because an author's name is free text and a
          # printable separator is a field the name can contain. Splitting on
          # `|` gave the last variable everything after the second one, so
          # `|Claude <real.person@example.com>` read as an EMPTY name and an
          # email of `Claude|real.person@example.com` — a person refused as "a
          # placeholder identity", shown a name and an address that are not
          # theirs and no way to work out which. That is the barrier the
          # denylist below exists to avoid, arriving by a different route.
          #
          # It never let an agent through: the email cases match as substrings
          # and survive the shift, and the names on the list contain no
          # separator to split on. So this buys a correct diagnostic rather
          # than a closed hole.
          #
          # `git log -z` terminates each commit with NUL instead of a newline,
          # so with `%x00` between the fields every record is exactly three
          # NUL-delimited reads and nothing carries a stray newline. The three
          # reads are chained with `&&`, which also ends the loop cleanly at
          # end of input; a separate emptiness guard would be answering a
          # question the chain has already answered.
          #
          # A control character is not an alternative here: git preserves
          # \x01 and \x1f in an ident and strips only what would break the
          # commit object. NUL is the one byte that cannot appear.
          while IFS= read -r -d '' sha && IFS= read -r -d '' name && IFS= read -r -d '' email; do
            reason=""
            # Emails match as substrings — an agent's address is distinctive
            # enough that no person shares one.
            case "${email,,}" in
              *noreply@anthropic.com*) reason="a coding agent" ;;
              *you@example.com*|*@localhost|*@localhost.localdomain)
                reason="a placeholder identity" ;;
            esac
            # Names match WHOLE, never as a prefix. "Claude" is banned and
            # Claudia is a person; a glob would refuse her first contribution
            # and give her no way to tell why.
            case "${name,,}" in
              claude|"claude code"|cursor|codex|devin|aider|"github copilot"|copilot)
                reason="a coding agent" ;;
              root|unknown|"your name"|"") reason="a placeholder identity" ;;
            esac
            [ -n "$reason" ] || continue
            echo "::error::$sha is authored by $reason: $name <$email>"
            fail=1
          done < <(git log -z --format='%H%x00%an%x00%ae' "$BASELINE..HEAD")
          if [ "$fail" -ne 0 ]; then
            echo "::error::Set your own name and email before committing. In a cloud"
            echo "::error::agent session that means GIT_AUTHOR_NAME, GIT_AUTHOR_EMAIL,"
            echo "::error::GIT_COMMITTER_NAME and GIT_COMMITTER_EMAIL in the environment"
            echo "::error::settings — the container's gitconfig resets every session."
            echo "::error::CONTRIBUTING.md §'Who a commit is from' has the detail."
            exit 1
          fi
          echo "$(git rev-list --count "$BASELINE..HEAD") commit(s) since the baseline, each authored by a person"

  data:
    name: data · published JSON is committed and parses
    runs-on: ubuntu-latest
    # No install step at all — a checkout, then bare node and system python3.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Every payload the SPA loads is present and valid JSON
        # The pipeline gates run against live rows at publish time and are
        # gone by the time anyone reviews a diff. This catches the operational
        # half: a refresh that ran but was never committed.
        #
        # Two other places reconcile the same manifest —
        # `test_every_published_payload_has_a_publisher_and_a_consumer` in
        # pipeline/tests, and the two payload cases in
        # `verify_data_contracts.mjs` — so this job reads as the third copy of
        # one assertion and as the obvious thing to delete. It is not, and the
        # reason is not thoroughness: **both of those run only if their
        # toolchain installed first.** A `npm ci` that fails on ERESOLVE or a
        # pip resolution that ends in ResolutionImpossible takes its whole job
        # red before a single assertion executes, and .github/dependabot.yml
        # documents two such incidents by name. This job has no install step at
        # all — bare node reads `payloads.js`, system python3 parses — so it is
        # the one that still answers on exactly the runs where the other two
        # cannot. `site/scripts/published-payload.mjs` makes the neighbouring
        # point for the suites' side of it.
        #
        # It costs nothing to keep: seconds, in parallel, under a run whose
        # length is set by the Windows job.
        #
        # The list comes from `site/src/lib/payloads.js` — the SPA's own
        # manifest — and never from a copy of it kept here. A hardcoded list in
        # this file is a payload set nothing reconciles against the SPA, and it
        # goes stale silently, which is the whole reason the list is read from
        # the manifest rather than kept here. `payloads.js` imports nothing, so
        # bare node reads it with no npm install and this job stays install-free.
        run: |
          set -euo pipefail
          files=$(node --input-type=module -e \
            "import {PAYLOAD_FILES} from './site/src/lib/payloads.js'; console.log(PAYLOAD_FILES.join(' '))")
          [ -n "$files" ] || { echo "::error::payloads.js declared no payloads"; exit 1; }
          for f in $files; do
            python3 -c "import json,sys; json.load(open('data/published/$f.json'))" \
              || { echo "::error file=data/published/$f.json::missing or not valid JSON"; exit 1; }
          done
          # …and nothing published that the SPA does not read. An orphan payload
          # still dates the deployed site and still gets cited as a source.
          for path in data/published/*.json; do
            stem=$(basename "$path" .json)
            case " $files " in
              *" $stem "*) ;;
              *) echo "::error file=$path::published but absent from payloads.js"; exit 1 ;;
            esac
          done
          echo "$(echo "$files" | wc -w) payloads present, parseable, and all read by the SPA"
