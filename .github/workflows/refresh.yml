# Reusable workflow: refresh one published payload and open a PR.
#
# Inputs: `source` — the name passed to `vyarno-pipeline refresh --source`.
#
# Steps: checkout, install the pipeline, run it against live upstreams,
# stage and capture changes, compute the source's as_of plus any payloads
# older than 30 days, commit with --signoff, push the data/<source>
# branch, open a PR, and dispatch CI against it.
#
# The pipeline's exit codes drive the rest of the workflow:
#   0 — published, JSON written
#   2 — input/transform error (upstream shape changed)
#   3 — a validation gate failed
#   4 — network/HTTP
# Non-zero exits skip the commit/push/PR path entirely; the previously
# published JSON stays in place. Nothing partial is ever written.

name: refresh

on:
  workflow_call:
    inputs:
      source:
        description: "vyarno-pipeline --source name (e.g. hicp, mortgage)"
        required: true
        type: string

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      # `actions: write` is what dispatches CI onto the branch this job
      # pushes. See the "Dispatch CI" step for why that is not optional.
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Every other checkout in this repository sets this false. This one
          # must not: the push below authenticates with the credential helper
          # checkout writes into `.git/config`, and nothing else here carries a
          # token. Stated rather than left to the action's default, because a
          # default that flips turns the push into an auth failure at the end
          # of a fifteen-minute job.
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install pipeline
        working-directory: pipeline
        run: |
          python -m venv .venv
          .venv/bin/pip install -q -e '.[dev]'

      - name: Trust the БНБ intermediate
        if: inputs.source == 'mortgage'
        # `www.bnb.bg` presents a leaf issued by GeoTrust EV RSA CA G2 and does
        # not send that intermediate, so a default trust store cannot build the
        # chain and the mortgage arm exits 4 with "unable to get local issuer
        # certificate". The fix is to supply the missing link from the leaf's
        # own AIA URL — never to disable verification, which would hand the one
        # connector that fetches a rate over a bank's own TLS to anyone on the
        # path (docs/data-sources.md §"TLS setup").
        #
        # Written into certifi's bundle AND exported as SSL_CERT_FILE, because
        # which one httpx reads depends on how its default SSL context is
        # built, and a runner is not the place to discover the answer once a
        # month. Appending to certifi's own file is the belt: httpx uses that
        # bundle whatever the environment says.
        run: |
          set -euo pipefail
          curl -sSL -o /tmp/g2.crt 'http://cacerts.digicert.com/GeoTrustEVRSACAG2.crt'
          openssl x509 -in /tmp/g2.crt -inform DER -out /tmp/g2.pem
          BUNDLE=$(pipeline/.venv/bin/python -c 'import certifi; print(certifi.where())')
          cat /tmp/g2.pem >> "$BUNDLE"
          echo "SSL_CERT_FILE=$BUNDLE" >> "$GITHUB_ENV"
          curl -sS -o /dev/null -w 'бнб reachable: %{http_code}\n' --cacert "$BUNDLE" \
            https://www.bnb.bg/bnbweb/groups/public/documents/bnb_download/s_ir_loan_oa_hh_bg.xlsx

      - name: Run pipeline
        working-directory: pipeline
        run: |
          set -euo pipefail
          .venv/bin/vyarno-pipeline refresh \
            --source "${{ inputs.source }}" \
            --out ../data/published

      - name: Capture changed files
        id: diff
        # Stage first, THEN capture `git diff --cached`. Running diff
        # before `git add` always returns an empty list.
        #
        # If nothing changed, the rest of the workflow is skipped via
        # the `if: steps.diff.outputs.changed != ''` gates below —
        # no commit, no push, no PR.
        run: |
          set -euo pipefail
          git add -- data/published
          CHANGED=$(git diff --cached --name-only)
          {
            echo "changed<<EOF"
            echo "$CHANGED"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          if [[ -z "$CHANGED" ]]; then
            echo "::notice::No data/published changes — upstream has not republished. Nothing to PR."
          fi

      - name: Compute as_of + stale-sources
        id: meta
        if: steps.diff.outputs.changed != ''
        # 30-day threshold matches the freshness check workflow. The
        # site banner surfaces staleness at 45 days (view/freshness.js), so this
        # 30-day threshold gives two weeks of headroom.
        #
        # Also detects a "cached read" — a pipeline run that produced
        # the same data values as the previously committed version
        # (only the run-date as_of differs). In that case, the
        # downstream commit/push/PR steps are skipped via
        # `outputs.real_change`. PRs only ever open when the
        # upstream actually republished different data.
        run: |
          python3 - <<'PY'
          import datetime, glob, json, os, subprocess
          from pathlib import Path

          source = os.environ["SOURCE"]
          repo = Path(os.environ["GITHUB_WORKSPACE"])
          threshold_days = 30
          today = datetime.date.today()

          # **A `--source` name is not a filename.** The CLI option is
          # hyphenated and the payload it writes is not: `--source
          # region-salary` produces `region_salary.json`, and `salary-dist`
          # produces `salary_dist.json`. Matching the option name against the
          # stem finds nothing for either, and "nothing of mine changed" is
          # read below as a cached read — so the commit, the push and the PR
          # are all skipped and the run goes GREEN saying so. That is the worst
          # shape a data bug can take here: a quarterly payload that silently
          # never publishes, reported as a successful refresh.
          prefix = source.replace("-", "_")

          def stem_of(path):
              return os.path.basename(path).removesuffix(".json")

          def is_ours(stem):
              # `hicp` writes two files; every other arm writes one named
              # exactly for it.
              return stem == prefix or stem.startswith(prefix)

          paths = sorted(glob.glob(str(repo / "data/published/*.json")))

          # The as_of this run publishes, which is THIS source's — never the
          # newest date in the directory. A commit message reading "mortgage as
          # of 2026-08-10" over a payload dated 2026-06-30 dates the review
          # wrong, and the date in a data commit is the thing a reviewer checks
          # first.
          mine_as_of = []
          for path in paths:
              if not is_ours(stem_of(path)):
                  continue
              value = json.load(open(path)).get("as_of")
              if value:
                  mine_as_of.append(value)
          as_of = max(mine_as_of) if mine_as_of else "unknown"

          stale = []
          for path in paths:
              stem = stem_of(path)
              if is_ours(stem):
                  continue
              as_of_other = json.load(open(path)).get("as_of")
              if not as_of_other:
                  continue
              days = (today - datetime.date.fromisoformat(as_of_other)).days
              if days > threshold_days:
                  stale.append(f"{stem} ({days}d)")

          # Real-change detection: compare the working-tree payload
          # against the version currently committed on origin/main,
          # excluding the `as_of` field. Same data values = cached
          # read = skip the commit/PR entirely. The pipeline's own
          # exit-0 vs non-zero distinction is not enough — it can
          # exit 0 on a no-op re-publish.
          real_change = "yes"
          payload_files = []
          for path in paths:
              if not is_ours(stem_of(path)):
                  continue
              new_payload = json.load(open(path))
              # Read the committed version via `git show`.
              rel = os.path.relpath(path, repo)
              try:
                  committed = subprocess.check_output(
                      ["git", "-C", str(repo), "show", f"origin/main:{rel}"],
                      stderr=subprocess.DEVNULL,
                  )
                  committed_payload = json.loads(committed)
              except subprocess.CalledProcessError:
                  # File does not exist on origin/main yet — first
                  # commit for this source. Counts as a real change.
                  payload_files.append(path)
                  continue
              # Drop `as_of` and any other run-date metadata before
              # comparing. A data refresh is real if any other field
              # differs.
              new_norm = {k: v for k, v in new_payload.items() if k != "as_of"}
              committed_norm = {k: v for k, v in committed_payload.items() if k != "as_of"}
              if new_norm != committed_norm:
                  payload_files.append(path)

          if not payload_files:
              real_change = "no"
              print("::notice::Cached read — no real data change. Skipping commit/PR.")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"as_of={as_of}\n")
              f.write(f"real_change={real_change}\n")
              f.write(f"stale={'yes' if stale else 'no'}\n")
              if stale:
                  f.write(f"stale_list<<EOF\n")
                  f.write(", ".join(stale) + "\n")
                  f.write("EOF\n")
          print(f"as_of={as_of}")
          print(f"real_change={real_change}")
          print(f"stale={stale}")
          PY
        env:
          SOURCE: ${{ inputs.source }}

      - name: Commit
        if: steps.diff.outputs.changed != '' && steps.meta.outputs.real_change == 'yes'
        # **The identity is set in this step and not in one of its own.** A
        # runner has no git identity at all, so `git commit` aborts with "empty
        # ident name" and exit 128 — and it aborts HERE, at the end of a job
        # that has already installed the pipeline, fetched a live upstream and
        # written a correct payload. Every step before this one is green, the
        # one thing the run exists to do is the thing that does not happen, and
        # on a schedule nobody is watching when it happens.
        #
        # Keeping the two lines in the same block is what makes that
        # unrepeatable: a separate configure step is a step that can be moved,
        # renamed, made conditional or dropped while this one still looks
        # complete on its own. `test_cli_dispatch.py` asserts they stay
        # together.
        run: |
          set -euo pipefail
          git config user.name "vyarno-refresh"
          git config user.email "vyarno-refresh@users.noreply.github.com"
          git checkout -b "data/${{ inputs.source }}"
          git add -- data/published
          git commit --signoff -m "data refresh: ${{ inputs.source }} as of ${{ steps.meta.outputs.as_of }}"

      - name: Push
        if: steps.diff.outputs.changed != '' && steps.meta.outputs.real_change == 'yes'
        # **The branch outlives the run that made it.** It is created fresh
        # from `main` every time, but it is only deleted when its PR merges, so
        # a refresh that fires while the last one is still awaiting review
        # meets a `data/<source>` on origin whose history this branch does not
        # contain — and a plain push is refused as non-fast-forward. The whole
        # run then fails at the last step with a correct payload already built.
        #
        # `merge -s ours` resolves that without a force: it records the stale
        # branch as an ancestor and keeps THIS tree, byte for byte, so the push
        # fast-forwards and the PR shows the newest refresh against `main`.
        # Nothing is lost that anyone wanted — the superseded commit holds an
        # older read of the same upstream, and the payload it carried is the
        # one this run just re-fetched.
        #
        # Never `--force`: the branch is shared with an open PR, and a force
        # push there discards a review in progress rather than an old fetch.
        run: |
          set -euo pipefail
          BRANCH="data/${{ inputs.source }}"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "::notice::$BRANCH already on origin — superseding it in place."
            git fetch origin "$BRANCH"
            git merge -s ours --no-edit FETCH_HEAD
          fi
          git push -u origin "$BRANCH"

      - name: Open PR
        id: pr
        if: steps.diff.outputs.changed != '' && steps.meta.outputs.real_change == 'yes'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const source = process.env.SOURCE;
            const as_of = process.env.AS_OF;
            const staleList = process.env.STALE_LIST;
            const changed = (process.env.CHANGED || '').trim();

            const lines = [];
            lines.push(`## data refresh — ${source}`);
            lines.push('');
            lines.push(`**as_of:** ${as_of}`);
            lines.push('');
            lines.push('### Changed files');
            lines.push('');
            for (const f of changed.split('\n').filter(Boolean)) {
              lines.push(`- \`${f}\``);
            }
            if (staleList) {
              lines.push('');
              lines.push('### Other payloads > 30d old');
              lines.push('');
              lines.push(staleList);
              lines.push('');
              lines.push('These did not change in this run; they are listed so the reviewer sees the staleness banner a reader would see.');
            }
            lines.push('');
            lines.push('### Review');
            lines.push('');
            lines.push('- Diff against `main` is the change.');
            lines.push("- The gates ran against the live upstream before anything was written — a payload that fails one exits non-zero and never reaches a PR. `docs/validation-gates.md` says what each catches.");
            lines.push('- Five required CI checks on `main` are the deployment gate.');

            const body = lines.join('\n');

            const head = `data/${source}`;
            const base = 'main';

            // Idempotent: skip if a PR is already open for this branch.
            const existing = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: `${context.repo.owner}:${head}`,
            });
            if (existing.data.length > 0) {
              core.info(`PR already open for ${head} (#${existing.data[0].number}) — skipping`);
              core.setOutput('pr_url', existing.data[0].html_url);
              core.setOutput('pr_number', existing.data[0].number);
              return;
            }

            const { data: pr } = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `data refresh: ${source} as of ${as_of}`,
              head,
              base,
              body,
            });
            core.info(`Opened PR #${pr.number}: ${pr.html_url}`);
            core.setOutput('pr_url', pr.html_url);
            core.setOutput('pr_number', pr.number);
        env:
          SOURCE: ${{ inputs.source }}
          AS_OF: ${{ steps.meta.outputs.as_of }}
          STALE_LIST: ${{ steps.meta.outputs.stale_list }}
          CHANGED: ${{ steps.diff.outputs.changed }}

      - name: Dispatch CI
        if: steps.diff.outputs.changed != '' && steps.meta.outputs.real_change == 'yes'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        # **Nothing this job pushes triggers a workflow.** Events raised by the
        # automatic token do not create workflow runs — that is the loop-breaker
        # GitHub applies to every token-driven push and PR, and it is not
        # configurable. So `ci.yml`'s `push` and `pull_request` triggers both
        # stay silent here, no check run is ever created against this SHA, and
        # with five checks required by name the PR is not merely unchecked: it
        # is unmergeable, waiting on statuses that have no event to produce
        # them. The same trap the `pull_request` trigger exists to answer for a
        # fork, arriving from the other side.
        #
        # `workflow_dispatch` is the documented exception to that rule, which
        # is why it is the one used here. The run it starts reports its checks
        # against the branch head, which is the commit the PR is open on, so
        # the required checks resolve against the same SHA branch protection is
        # reading. `ci.yml` already carries the trigger; nothing there changes.
        #
        # A failure to dispatch does not fail the refresh — the payload is
        # committed and pushed by this point, and a PR that needs its checks
        # re-run by hand is a smaller problem than a red run over a good
        # refresh. It is logged as a notice so the reason is in the log.
        continue-on-error: true
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'ci.yml',
              ref: `data/${process.env.SOURCE}`,
            });
            core.info(`Dispatched CI on data/${process.env.SOURCE}`);
        env:
          SOURCE: ${{ inputs.source }}
