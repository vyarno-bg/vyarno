# Reusable workflow: refresh one published payload and open a PR — when the
# upstream republished, and at no other time.
#
# Inputs: `source` — the name passed to `vyarno-pipeline refresh --source`;
# `detected` — what `watch.yml` saw the upstream publish, empty when a backstop
# cron started the run instead. It reaches the pull-request body and nothing
# else: a run decides what to publish by fetching, never by what it was told.
#
# Steps: checkout, install the pipeline, run it against live upstreams, stage
# and capture changes, ask `vyarno-pipeline refresh-report` whether any figure
# moved and what to date the commit with, then — only if one did — commit with
# --signoff, push the data/<source> branch, open a PR and arm it to merge
# itself. The `ci-push` job then pushes that commit again with the deploy key,
# which is what starts the CI its required checks read.
#
# The pipeline's exit codes drive the rest of the workflow:
#   0 — published, JSON written
#   2 — input/transform error (upstream shape changed)
#   3 — a validation gate failed
#   4 — network/HTTP
# Non-zero exits skip the commit/push/PR path entirely; the previously
# published JSON stays in place. Nothing partial is ever written.

name: refresh

on:
  workflow_call:
    inputs:
      source:
        description: "vyarno-pipeline --source name (e.g. hicp, mortgage)"
        required: true
        type: string
      detected:
        description: "The upstream publication the watcher saw, if a watcher started this"
        required: false
        default: ""
        type: string
    secrets:
      PUSH_DEPLOY_KEY:
        description: "Deploy key with write access, read only by the ci-push job"
        required: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      real_change: ${{ steps.meta.outputs.real_change }}
      pushed: ${{ steps.push.outputs.sha }}
    concurrency:
      # **One run per arm at a time.** A watch tick and a backstop cron can
      # both reach this arm, and both push `data/<source>`: the second meets a
      # branch its history does not contain and either fails at the last step
      # or supersedes a payload the first is still opening a pull request for.
      group: refresh-${{ inputs.source }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      # `actions: write` is what dispatches CI onto the branch this job
      # pushes when there is no deploy key; see the "Dispatch CI" step.
      actions: write
    # Every script reads the arm's name from here and none has it pasted into
    # its source, so no input value can ever be parsed as shell or JavaScript.
    # HAS_KEY is a boolean: the key itself never reaches this job.
    env:
      SOURCE: ${{ inputs.source }}
      HAS_KEY: ${{ secrets.PUSH_DEPLOY_KEY != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Every other checkout in this repository sets this false. This one
          # must not: the push below authenticates with the credential helper
          # checkout writes into `.git/config`, and nothing else here carries a
          # token. Stated rather than left to the action's default, because a
          # default that flips turns the push into an auth failure at the end
          # of a fifteen-minute job.
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install pipeline
        working-directory: pipeline
        # From the hashed runtime lock, never the open ranges in pyproject.toml.
        # This job holds a token that can push and open pull requests, written
        # into `.git/config` above, so a dependency release nobody reviewed would
        # run with it; CI installs from the lock for the same reason.
        run: |
          python -m venv .venv
          .venv/bin/pip install -q -r requirements.txt
          .venv/bin/pip install -q -e . --no-deps

      - name: Trust the БНБ intermediate
        if: inputs.source == 'mortgage' || inputs.source == 'credit'
        # `www.bnb.bg` presents a leaf issued by GeoTrust EV RSA CA G2 and does
        # not always send that intermediate, so a default trust store cannot
        # build the chain and the arm exits 4 with "unable to get local issuer
        # certificate". The fix is to supply the missing link from the leaf's
        # own AIA URL — never to disable verification, which would hand the
        # connectors that fetch a rate over a bank's own TLS to anyone on the
        # path (docs/data-sources.md §"TLS setup").
        #
        # **Both arms that reach `sources/bnb.py`, not just the mortgage one.**
        # `credit` reads the revolving and non-financial workbooks off the same
        # host. Named alone, `mortgage` got the fix and `credit` ran the same
        # handshake without it — green for as long as БНБ's edge happened to
        # serve a full chain, and no rate at all on the day one did not.
        # `test_cli_dispatch.py` derives the pair from the imports.
        #
        # Written into certifi's bundle AND exported as SSL_CERT_FILE, because
        # which one httpx reads depends on how its default SSL context is
        # built, and a runner is not the place to discover the answer once a
        # month. Appending to certifi's own file is the belt: httpx uses that
        # bundle whatever the environment says.
        run: |
          set -euo pipefail
          curl -sSL -o /tmp/g2.crt 'http://cacerts.digicert.com/GeoTrustEVRSACAG2.crt'
          openssl x509 -in /tmp/g2.crt -inform DER -out /tmp/g2.pem
          BUNDLE=$(pipeline/.venv/bin/python -c 'import certifi; print(certifi.where())')
          cat /tmp/g2.pem >> "$BUNDLE"
          echo "SSL_CERT_FILE=$BUNDLE" >> "$GITHUB_ENV"
          curl -sS -o /dev/null -w 'бнб chain builds: %{http_code}\n' --cacert "$BUNDLE" \
            https://www.bnb.bg/bnbweb/groups/public/documents/bnb_download/s_ir_loan_oa_hh_bg.xlsx

      - name: Run pipeline
        working-directory: pipeline
        run: |
          set -euo pipefail
          .venv/bin/vyarno-pipeline refresh \
            --source "$SOURCE" \
            --out ../data/published

      - name: Capture changed files
        id: diff
        # Stage first, THEN capture `git diff --cached`: run before `git add`,
        # diff always returns an empty list. Nothing changed means every step
        # below is skipped on `steps.diff.outputs.changed` — no commit, no PR.
        run: |
          set -euo pipefail
          git add -- data/published
          CHANGED=$(git diff --cached --name-only)
          {
            echo "changed<<EOF"
            echo "$CHANGED"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          if [[ -z "$CHANGED" ]]; then
            echo "::notice::No data/published changes — upstream has not republished. Nothing to PR."
            # On the run page, where a notice folded into a job that did nothing
            # is not. A refresh finding the same figures is the good outcome and
            # has to read as one without opening the log.
            echo "### ${SOURCE} — nothing republished" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The payload the run wrote is the one already committed, byte for byte." \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Ask the pipeline what actually changed
        id: meta
        if: steps.diff.outputs.changed != ''
        # **The decision is the pipeline's; this step only hands it a ref.** A
        # comparison written here is executed by nothing in this repository —
        # `make check` does not run GitHub Actions — so the only check available
        # over it reads the YAML and agrees with it. `refresh_report.py` carries
        # what it decides, the manifest's per-payload cadence included.
        run: |
          set -euo pipefail
          node site/scripts/payload-cadence.mjs > /tmp/cadence.json
          pipeline/.venv/bin/vyarno-pipeline refresh-report \
            --source "$SOURCE" \
            --published data/published \
            --cadence /tmp/cadence.json \
            --against origin/main \
            --repo "$GITHUB_WORKSPACE" \
            --github-output "$GITHUB_OUTPUT" \
            --step-summary "$GITHUB_STEP_SUMMARY"

      - name: Commit
        if: steps.diff.outputs.changed != '' && steps.meta.outputs.real_change == 'yes'
        # **The identity is set in this step and not in one of its own.** A
        # runner has no git identity at all, so `git commit` aborts with "empty
        # ident name" and exit 128 — and it aborts HERE, at the end of a job
        # that has already installed the pipeline, fetched a live upstream and
        # written a correct payload. Every step before this one is green, the
        # one thing the run exists to do is the thing that does not happen, and
        # on a schedule nobody is watching when it happens.
        #
        # Keeping the two lines in the same block is what makes that
        # unrepeatable: a separate configure step is a step that can be moved,
        # renamed, made conditional or dropped while this one still looks
        # complete on its own. `test_cli_dispatch.py` asserts they stay
        # together.
        env:
          AS_OF: ${{ steps.meta.outputs.as_of }}
        run: |
          set -euo pipefail
          git config user.name "vyarno-refresh"
          git config user.email "vyarno-refresh@users.noreply.github.com"
          git checkout -b "data/${SOURCE}"
          git add -- data/published
          git commit --signoff -m "data refresh: ${SOURCE} as of ${AS_OF}"

      - name: Push
        id: push
        if: steps.diff.outputs.changed != '' && steps.meta.outputs.real_change == 'yes'
        # **The branch outlives the run that made it.** It is created fresh
        # from `main` every time, but it is only deleted when its PR merges, so
        # a refresh that fires while the last one is still awaiting review
        # meets a `data/<source>` on origin whose history this branch does not
        # contain — and a plain push is refused as non-fast-forward. The whole
        # run then fails at the last step with a correct payload already built.
        #
        # `merge -s ours` resolves that without a force: it records the stale
        # branch as an ancestor and keeps THIS tree, byte for byte, so the push
        # fast-forwards and the PR shows the newest refresh against `main`.
        # Nothing is lost that anyone wanted — the superseded commit holds an
        # older read of the same upstream, and the payload it carried is the
        # one this run just re-fetched.
        #
        # `--force-with-lease` is the one exception to "never force", and the
        # lease is what makes the supersede above safe. It names the exact SHA
        # the fetch returned, so a branch that moved in between, such as a
        # manual `git push` from Kiril, is refused instead of clobbered, with
        # the same error a plain push would give. `merge -s ours` has already
        # made this push a fast-forward, so the lease never has to force
        # anything: it is the assertion that the branch we superseded is still
        # the branch we fetched.
        run: |
          set -euo pipefail
          BRANCH="data/${SOURCE}"
          EXPECTED=""
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "::notice::$BRANCH already on origin — superseding it in place."
            git fetch origin "$BRANCH"
            EXPECTED=$(git rev-parse "origin/$BRANCH")
            git merge -s ours --no-edit FETCH_HEAD
          fi
          if [[ -n "$EXPECTED" ]]; then
            git push --force-with-lease="refs/heads/$BRANCH:$EXPECTED" -u origin "$BRANCH"
          else
            git push -u origin "$BRANCH"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Open PR
        id: pr
        if: steps.diff.outputs.changed != '' && steps.meta.outputs.real_change == 'yes'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const source = process.env.SOURCE;
            const as_of = process.env.AS_OF;
            const staleList = process.env.STALE_LIST;
            const detected = (process.env.DETECTED || '').trim();
            const changed = (process.env.CHANGED || '').trim();

            const lines = [];
            lines.push(`## data refresh — ${source}`);
            lines.push('');
            lines.push(`**as_of:** ${as_of}`);
            // What the watcher saw, against when this pull request went up. The
            // gap between the two is the only measure of whether this site is
            // first with a figure or repeating one the newspapers ran
            // yesterday, and it exists nowhere else once the run's logs expire.
            if (detected) {
              lines.push('');
              lines.push(`**Upstream:** ${detected}`);
              lines.push(`**Caught:** this pull request opened ${new Date().toISOString()}`);
            }
            lines.push('');
            lines.push('### Changed files');
            lines.push('');
            for (const f of changed.split('\n').filter(Boolean)) {
              lines.push(`- \`${f}\``);
            }
            if (staleList) {
              lines.push('');
              lines.push('### Other payloads past their own cadence');
              lines.push('');
              lines.push(staleList);
              lines.push('');
              lines.push('These did not change in this run; they are listed so the reviewer sees the staleness banner a reader would see.');
            }
            lines.push('');
            lines.push('### Review');
            lines.push('');
            lines.push('- Diff against `main` is the change.');
            lines.push("- The gates ran against the live upstream before anything was written — a payload that fails one exits non-zero and never reaches a PR. `docs/validation-gates.md` says what each catches.");
            lines.push('- It merges itself once the five required CI checks are green. Label it `hold` to stop that; `docs/architecture.md` §"What happens to a data pull request".');

            const body = lines.join('\n');

            const head = `data/${source}`;
            const base = 'main';

            // Idempotent: skip if a PR is already open for this branch.
            const existing = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: `${context.repo.owner}:${head}`,
            });
            if (existing.data.length > 0) {
              core.info(`PR already open for ${head} (#${existing.data[0].number}) — skipping`);
              core.setOutput('pr_url', existing.data[0].html_url);
              core.setOutput('pr_number', existing.data[0].number);
              return;
            }

            const { data: pr } = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `data refresh: ${source} as of ${as_of}`,
              head,
              base,
              body,
            });
            core.info(`Opened PR #${pr.number}: ${pr.html_url}`);
            core.setOutput('pr_url', pr.html_url);
            core.setOutput('pr_number', pr.number);
        env:
          AS_OF: ${{ steps.meta.outputs.as_of }}
          STALE_LIST: ${{ steps.meta.outputs.stale_list }}
          DETECTED: ${{ inputs.detected }}
          CHANGED: ${{ steps.diff.outputs.changed }}

      - name: Dispatch CI
        if: steps.diff.outputs.changed != '' && steps.meta.outputs.real_change == 'yes' && env.HAS_KEY != 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        # Without the deploy key, the one way CI reaches this commit at all. A
        # dispatched run reports on the commit and never on the PR, so the PR
        # waits for a person to approve its own run; with the key, `ci-push`
        # makes this unnecessary. Not fatal: the payload is already pushed.
        continue-on-error: true
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'ci.yml',
              ref: `data/${process.env.SOURCE}`,
            });
            core.info(`Dispatched CI on data/${process.env.SOURCE}`);

      - name: Merge once CI is green, unless held
        if: steps.diff.outputs.changed != '' && steps.meta.outputs.real_change == 'yes'
        # A green gate run plus green CI is the publication: the gates already
        # stopped any payload they doubted, and these arms raise no softer flag.
        # `hold` or `needs-review` keeps it for a person (`automerge.py`). Not
        # fatal: a PR that cannot be armed waits for a merge by hand.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
        run: pipeline/.venv/bin/python -m vyarno_pipeline.automerge --pr "$PR_NUMBER"

  # The push above is the workflow token's, which starts no CI run, and only a
  # push or pull_request run counts toward the PR's required checks. Pushing
  # the same commit again with a deploy key starts both, and the auto-merge
  # armed above then merges it. The key lives here, in a job that runs nothing
  # the pipeline installed, and never in the one above.
  ci-push:
    needs: refresh
    if: needs.refresh.outputs.real_change == 'yes' && needs.refresh.outputs.pushed != ''
    runs-on: ubuntu-latest
    # One checkout and one push.
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      SOURCE: ${{ inputs.source }}
      PUSHED: ${{ needs.refresh.outputs.pushed }}
      HAS_KEY: ${{ secrets.PUSH_DEPLOY_KEY != '' }}
    steps:
      - name: Checkout the pushed refresh with the deploy key
        if: env.HAS_KEY == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.refresh.outputs.pushed }}
          # At depth 1 the head is a shallow root, and amending it makes a commit
          # with no parent at all: a branch with no history in common with main.
          fetch-depth: 2
          ssh-key: ${{ secrets.PUSH_DEPLOY_KEY }}
          # The push below authenticates with the key checkout configures.
          persist-credentials: true

      - name: Push it again as a commit of the key's
        if: env.HAS_KEY == 'true' && needs.refresh.outputs.real_change == 'yes'
        # Same tree, message, author and sign-off; only the committer date moves,
        # which is what makes it a new commit for the push to carry. The lease
        # names the SHA the job above pushed, so a branch that moved since is
        # refused rather than replaced. data-pr.yml skips this committer.
        run: |
          set -euo pipefail
          git config user.name "vyarno-refresh"
          git config user.email "vyarno-refresh@users.noreply.github.com"
          git commit --amend --no-edit --quiet
          parents() { git cat-file commit "$1" | sed -n 's/^parent //p'; }
          if [[ "$(parents HEAD)" != "$(parents "$PUSHED")" || -z "$(parents HEAD)" ]]; then
            echo "::error::the re-made commit's parents differ from $PUSHED's; not pushing" && exit 1
          fi
          if [[ "$(git rev-parse HEAD)" == "$PUSHED" ]]; then
            echo "::error::the re-made commit is $PUSHED itself, so a push would start nothing" && exit 1
          fi
          BRANCH="data/${SOURCE}"
          git push --force-with-lease="refs/heads/$BRANCH:$PUSHED" origin "HEAD:refs/heads/$BRANCH"
