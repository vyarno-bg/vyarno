# Quarterly НСИ housing refresh (ИЦЖ — the national house price index change,
# the same figure for the six cities over 120,000 people, and the change in the
# number of sales for those cities).
#
# The other half of `/market/`'s second section, and the only source of a
# per-city figure on it. Every value is a cell НСИ published: their licence
# forbids distributing производни и сборни произведения, so this payload carries
# no gap, no ratio and no level — and no level exists to carry anyway, since
# their own лв./кв.м survey ran to 2014-Q2 and was discontinued.
#
# **This arm also runs the cross-publisher reconciliation.** НСИ compile the
# house price index and Eurostat disseminate it, so `nsi_housing.json` and
# `house_market.json` carry the same statistic by two routes and must agree to
# the decimal. That gate reads Eurostat's payload off disk, and НСИ are about a
# week ahead — 23.06.2026 against Eurostat's 02.07 for 2026-Q1 — so a run
# between the two publishers reconciles at the newest quarter BOTH carry rather
# than failing on one nobody has yet.
#
# `watch.yml` reads the three workbooks' Last-Modified headers inside the
# window `release_calendar.py` records and dispatches this arm the hour НСИ
# upload. The cron is the backstop for that watcher being broken: the 29th,
# once the window has closed.

name: refresh-nsi-housing

on:
  schedule:
    - cron: "20 12 29 3,6,9,12 *"
  workflow_dispatch:
    inputs:
      detected:
        description: "The upstream publication a watcher saw. Reaches the PR body."
        required: false
        default: ""
        type: string

jobs:
  refresh:
    permissions:
      contents: write
      pull-requests: write
      actions: write
    uses: ./.github/workflows/refresh.yml
    with:
      source: nsi-housing
      detected: ${{ inputs.detected || '' }}
