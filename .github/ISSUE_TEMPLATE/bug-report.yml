name: "Bug report"
description: "Something is broken, misbehaving or unreadable."
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        For a **wrong number**, please use the "Incorrect figure" template
        instead — it asks the questions that make that specific bug fixable.

        For a **security problem**, do not open an issue at all: see
        [SECURITY.md](../blob/main/SECURITY.md).

  - type: textarea
    id: what
    attributes:
      label: What happened?
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect instead?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open vyarno.bg
        2. Enter a salary of ...
        3. Switch to EN
        4. The mortgage panel shows ...
    validations:
      required: false

  - type: input
    id: build
    attributes:
      label: Build ID
      description: >
        The short string at the bottom-right of the footer. It tells us exactly
        which deploy you were on.
      placeholder: "2026-07-29-a1b2c3d"
    validations:
      required: false

  - type: input
    id: environment
    attributes:
      label: Browser and device
      placeholder: "Firefox 128, Android"
    validations:
      required: false

  - type: dropdown
    id: language
    attributes:
      label: Which language were you using?
      options:
        - Български
        - English
        - Both / switching between them
    validations:
      required: false
