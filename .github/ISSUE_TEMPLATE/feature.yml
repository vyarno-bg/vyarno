name: Feature request
description: A change that would make vyarno.bg more useful, *and* is not on the closed list in docs/principles.md.
labels: ["type: enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      placeholder: |
        A household with two earners cannot model the tax wedge jointly —
        the calculator treats gross income as a single stream. The published
        Bulgarian data has a household-income series that would let us
        model this without server-side calculation.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What change would solve it?
    validations:
      required: true

  - type: textarea
    id: data
    attributes:
      label: Where would the data come from?
      placeholder: |
        Eurostat HBS or НСИ household budget survey, both already cited in
        data-sources.md.
  - type: dropdown
    id: privacy
    attributes:
      label: Does the proposal move any personal-figure calculation server-side?
      options:
        - 'No — everything stays in the reader''s browser'
        - 'Yes — see below'
        - Not sure
  - type: textarea
    id: privacy_note
    attributes:
      label: If yes or not sure — why would server-side be necessary?
